<!DOCTYPE html>
<!--/*
  협력업체 관리 — 등록.
  출처: legacy/ERFlow/src/main/webapp/company/companyRegister.jsp

  unit 과 달리 팝업이 아니다. 레거시도 이 화면에 헤더·사이드메뉴를 include 했다.

  상청/하청 표시 입력에는 label 도 name 도 id 도 없다. 화면에 보이기만 하고 서버로
  가지도 않는다. 레거시 접근성 결함이지만 고치는 것은 이관이 아니므로 그대로 둔다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('협력업체 추가 페이지', ${ {'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css', '/css/bootcss/bootstrap.css', '/css/common/common.css', '/css/main/aside.css', '/css/main/header.css', '/css/main/companyRegister.css'} }, ${ {'https://code.jquery.com/jquery-latest.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.9.2/umd/popper.min.js', '//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js', '/js/bootjs/bootstrap.js', '/js/admin/location.js', '/js/main/index.js', '/js/main/companyRegister.js'} })}">
</head>
<body>
<th:block th:replace="~{fragments/header :: header(${headerMenu}, ${currentUser})}"></th:block>

<div class="content-wrap">
    <th:block th:replace="~{fragments/side-menu :: side(${sideMenu})}"></th:block>

    <div class="company-insert-wrap">
        <div class="right-align">
            <span class="menu-name"
                  th:text="|사용자 > ${flag == 0 ? '영업' : '구매'} > 협력업체 추가|">사용자 &gt; 구매 &gt; 협력업체 추가</span>
        </div>
        <div class="company-insert">
            <div class="company-form">
                <form th:action="@{/company/register}" method="post">
                    <div class="form-group">
                        <label for="companyName">회사명</label>
                        <input type="text" id="companyName" name="companyName" placeholder="회사명">
                        <input type="hidden" name="status" th:value="${flag}">
                        <input type="text" th:value="${flag == 0 ? '상청' : '하청'}" readonly>
                    </div>
                    <div class="form-group">
                        <label for="input4">회사 주소:</label>
                        <input type="text" id="sample6_postcode" placeholder="우편번호" name="postalCode">
                        <input type="text" id="sample6_extraAddress" placeholder="참고항목">
                        <input type="button" class="btn_execDaumPostcode" value="우편 찾기">
                        <input type="text" id="sample6_address" placeholder="도로명 주소" name="address1"><br>
                        <input type="text" id="sample6_detailAddress" placeholder="상세주소" name="address2">
                    </div>
                    <div class="form-group">
                        <label for="companyPhone">업체 전화번호</label>
                        <input type="text" id="companyPhone" name="companyPhone" placeholder="업체 전화 번호">
                    </div>
                    <div class="form-group">
                        <label for="businessNumber">사업자 등록번호</label>
                        <input type="text" id="businessNumber" name="businessNumber" placeholder="사업자 등록번호">
                    </div>
                    <div class="form-group">
                        <label for="workCode">업체 종목 선택</label>
                        <input type="text" id="workCode" name="workCode" placeholder="업체코드" readonly>
                        <input type="text" id="workName" name="workName" placeholder="업체명" readonly>
                        <input type="button" id="find-work" value="업체 찾기">
                    </div>
                    <div class="form-group">
                        <label for="bankCode">은행 선택</label>
                        <input type="text" id="bankCode" name="bankCode" placeholder="은행 코드" readonly>
                        <input type="text" id="bankName" name="bankName" placeholder="은행명" readonly>
                        <input type="button" id="find-bank" value="은행 찾기">
                    </div>
                    <div class="form-group">
                        <label for="bankAccount">은행 계좌번호</label>
                        <input type="text" id="bankAccount" name="bankAccount" placeholder="계좌 번호">
                    </div>
                    <div class="form-group text-center">
                        <button type="submit" class="form-Register-btn">제출</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
