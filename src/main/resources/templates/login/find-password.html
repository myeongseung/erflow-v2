<!DOCTYPE html>
<!--/*
  비밀번호 찾기.
  출처: legacy/ERFlow/src/main/webapp/login/findPassword.jsp

  로그인 화면의 «Forgot Password?» 가 여기로 온다.

  «send» 는 메일 발송 서블릿(mail/SendMail)이 받는다. 그 기능은 이관 범위 밖이다 —
  SMTP 자격증명과 인증 토큰 발급이 딸려 있고, 성공 화면(login/sendOk.html)도 아직
  이관 전이다(O-011). 주소를 레거시 그대로 두어 «여기가 비어 있다»가 드러나게 한다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: page('ERFlow Help Center', ${ {'/js/login/loginSub.js'} })}">
</head>
<body>
<img class="wave" th:src="@{/images/login/backImage.png}">
<div class="page-box">
    <div class="img">
        <img th:src="@{/images/common/logo.png}">
    </div>
    <div class="login-content">
        <form action="../mail/SendMail" method="post">
            <h2 class="title">Forgot your password?</h2>
            <div class="input-div one">
                <div class="i">
                    <i class="fas fa-user"></i>
                </div>
                <div class="div">
                    <h5 class="h5-input">Username</h5>
                    <input type="text" class="input" name="id">
                </div>
            </div>
            <div class="input-div pass">
                <div class="i">
                    <i class="fa-regular fa-envelope fa-lg"></i>
                </div>
                <div class="div">
                    <h5 class="h5-input">Email</h5>
                    <input type="email" class="input" name="email">
                </div>
            </div>
            <input type="submit" class="btn" value="send">
        </form>
    </div>
</div>
</body>
</html>
