<!DOCTYPE html>
<!--/*
  로그인.
  출처: legacy/ERFlow/src/main/webapp/login/login.jsp

  form 에 _csrf hidden 입력이 생긴다. 레거시에는 없던 요소이며 의도한 추가다
  (SecurityConfig 주석 참조). 정합성 게이트는 allowlist 로 통과시킨다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ERFlow Login</title>
    <link rel="stylesheet" th:href="@{/css/login/login.css}">
    <script th:src="@{https://code.jquery.com/jquery-latest.min.js}"></script>
    <script th:src="@{https://kit.fontawesome.com/a81368914c.js}"></script>
    <script th:src="@{/js/login/loginSub.js}"></script>
    <link href="https://fonts.googleapis.com/css?family=Poppins:600&display=swap" rel="stylesheet">
</head>
<body>
<img class="wave" th:src="@{/images/login/backImage.png}">
<div class="container">
    <div class="img">
        <img th:src="@{/images/common/logo.png}">
    </div>
    <div class="login-content">
        <form th:action="@{/login}" method="post">
            <img src="https://raw.githubusercontent.com/sefyudem/Responsive-Login-Form/master/img/avatar.svg">
            <h2 class="title">Welcome</h2>
            <div class="input-div one">
                <div class="i">
                    <i class="fas fa-user"></i>
                </div>
                <div class="div">
                    <h5 class="h5-input">Username</h5>
                    <input type="text" name="id" class="input">
                </div>
            </div>
            <div class="input-div pass">
                <div class="i">
                    <i class="fas fa-lock"></i>
                </div>
                <div class="div">
                    <h5 class="h5-input">Password</h5>
                    <input type="password" name="password" class="input">
                </div>
            </div>
            <a th:href="@{/login/find-password}">Forgot Password?</a>
            <input type="submit" class="btn" value="Login">
        </form>
    </div>
</div>
</body>
</html>
