<!DOCTYPE html>
<!--/*
  근태 확인 (D-164). 전 직원의 한 달 근태를 8명씩 끊어 보여준다.
  출처: legacy/ERFlow/src/main/webapp/work/work.jsp

  목록 틀(D-148)의 카드 하나. 도구줄 왼쪽이 달 넘기기(이전 달 · 달 고르기 · 다음 달),
  오른쪽이 부서·이름 검색이다. 도구줄 전체가 GET 폼 하나라 달을 바꿔도 검색어가
  남고, 검색해도 달이 남는다. 달 고르기는 값이 바뀌면 바로 보낸다(js/work/work.js).
  검색은 돋보기와 Enter(js/common/table.js), 쪽 번호는 보통의 GET 링크다.

  표는 D-127 그대로다 — 한 사람이 두 줄(1~16일, 17일~말일)이고 사람마다 <tbody> 를
  둔다. 정상 근무는 일한 시간(HH:mm), 나머지는 상태 이름이 색 글자로 찍히며 통계는
  한 달 합계를 한 번만 적는다. 조퇴의 주말 처리는 윗줄과 아랫줄이 다르다(D-099).
  이름 세 칸은 왼쪽에 붙어 있고, 날짜 칸은 판이 넓으면 같이 넓어진다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: page('근태 확인', ${ {'/js/common/table.js', '/js/work/work.js'} })}">
</head>
<body th:insert="~{fragments/user-shell :: shell('사용자 &gt; 근태 관리 &gt; 근태 확인', |직원 ${page.totalRecord}명|, ~{::content})}">
<th:block th:fragment="content">
    <section class="list-card">
        <form class="toolbar" th:action="@{/work}" method="get">
            <div class="toolbar-actions month-nav">
                <a class="btn" th:if="${prevMonth != null}"
                   th:href="@{/work(date=${prevMonth},keyfield=${keyfield},keyword=${keyword})}">이전 달</a>
                <span class="btn disabled" th:unless="${prevMonth != null}" aria-disabled="true"
                      title="올해 1월보다 앞은 볼 수 없습니다">이전 달</span>
                <input type="month" name="date" th:min="${minMonth}" th:value="${month}" aria-label="볼 달">
                <a class="btn" th:href="@{/work(date=${nextMonth},keyfield=${keyfield},keyword=${keyword})}">다음 달</a>
            </div>
            <div class="toolbar-search">
                <select name="keyfield" aria-label="검색할 칸">
                    <option value="" th:selected="${keyfield == ''}">전체 조회</option>
                    <option value="dept" th:selected="${keyfield == 'dept'}">부서</option>
                    <option value="name" th:selected="${keyfield == 'name'}">이름</option>
                </select>
                <div class="main-search-container">
                    <div class="main-search-border">
                        <input class="main-search-text" type="search" name="keyword"
                               placeholder="직원 검색" aria-label="직원 검색어" th:value="${keyword}">
                    </div>
                    <div class="main-search-icon">
                        <i class="fa-solid fa-magnifying-glass fa-lg" title="검색하기"></i>
                    </div>
                </div>
            </div>
        </form>

        <div class="table-scroll">
            <table class="table attendance-sheet">
                <!--/*
                  너비는 colgroup 이 정한다 — 이름셋·통계넷은 적은 대로, 날짜 칸은 남는 폭을
                  나눠 갖는다(app.css 의 .attendance-sheet 설명).
                */-->
                <colgroup>
                    <col class="col-name">
                    <col class="col-dept">
                    <col class="col-job">
                    <col class="col-day" th:each="day : ${firstHeaders}">
                    <col class="col-tally">
                    <col class="col-tally">
                    <col class="col-tally">
                    <col class="col-tally">
                </colgroup>
                <thead>
                <tr class="sheet-head">
                    <th colspan="3">구분</th>
                    <th th:each="day : ${firstHeaders}"
                        th:class="${day.headerClass}" th:text="${day.label}">01</th>
                    <th colspan="4">통계 <span class="sheet-note">(한 달)</span></th>
                </tr>
                <tr class="sheet-head">
                    <th class="sheet-name">성명</th>
                    <th class="sheet-dept">부서</th>
                    <th class="sheet-job">직책</th>
                    <th:block th:each="day : ${secondHeaders}">
                        <th th:if="${day.inMonth}"
                            th:class="${day.headerClass}" th:text="${day.label}">17</th>
                        <th th:unless="${day.inMonth}"></th>
                    </th:block>
                    <th>정상</th>
                    <th>지각</th>
                    <th>조퇴</th>
                    <th>연차</th>
                </tr>
                </thead>
                <tbody th:if="${#lists.isEmpty(rows)}">
                <tr>
                    <td colspan="23" class="empty-cell">검색한 직원이 없습니다.</td>
                </tr>
                </tbody>
                <tbody th:each="row : ${rows}">
                <tr th:with="tally=${row.sheet.total()}">
                    <td rowspan="2" class="sheet-name" th:text="${row.user.name}">성명</td>
                    <td rowspan="2" class="sheet-dept" th:text="${row.user.deptName}">부서</td>
                    <td rowspan="2" class="sheet-job" th:text="${row.user.jobName}">직책</td>
                    <td th:each="cell : ${row.sheet.first.cells}"
                        th:class="${cell.cellClass()}" th:text="${cell.text}"></td>
                    <td rowspan="2" class="sheet-tally" th:text="${tally.normal}">0</td>
                    <td rowspan="2" class="sheet-tally" th:text="${tally.late}">0</td>
                    <td rowspan="2" class="sheet-tally" th:text="${tally.leave}">0</td>
                    <td rowspan="2" class="sheet-tally"
                        th:text="${tally.vacationLabel()}">0.0</td>
                </tr>
                <tr>
                    <td th:each="cell : ${row.sheet.second.cells}"
                        th:class="${cell.cellClass()}" th:text="${cell.text}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="page-controller" th:if="${page.totalPage > 1}">
            <a th:if="${page.hasPreviousBlock()}"
               th:href="@{/work(nowPage=${page.previousBlockPage()},date=${month},keyfield=${keyfield},keyword=${keyword})}">이전</a>
            <ul class="page-numbers">
                <li th:each="n : ${page.pageNumbers}">
                    <a th:href="@{/work(nowPage=${n},date=${month},keyfield=${keyfield},keyword=${keyword})}"
                       th:classappend="${n == page.nowPage} ? 'disabled'" th:text="${n}">1</a>
                </li>
            </ul>
            <a th:if="${page.hasNextBlock()}"
               th:href="@{/work(nowPage=${page.nextBlockPage()},date=${month},keyfield=${keyfield},keyword=${keyword})}">다음</a>
        </div>
    </section>
</th:block>
</body>
</html>
