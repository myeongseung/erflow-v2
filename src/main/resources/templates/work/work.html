<!DOCTYPE html>
<!--/*
  근태 확인. 전 직원의 한 달 근태를 8명씩 끊어 보여준다.
  출처: legacy/ERFlow/src/main/webapp/work/work.jsp

  프로필의 근무 달력과 데이터는 같지만 그리는 법이 다르다 — 색이 아니라 **글자**다.
  정상 근무는 일한 시간(HH:mm), 나머지는 상태 이름이 색 글자로 찍힌다. 통계는
  한 달 합계로 한 번만 찍고(D-127), 조퇴의 주말 처리는 윗줄과 아랫줄이 다르다(D-099).

  워크플로는 전부 readFrm 을 지나간다 — 달 검색·칸 검색·페이징이 그 폼에 값을 옮겨
  담아 제출한다(js/work/work.js).

  레거시는 jQuery 를 세 번 실었다(나중 것이 이긴다). 라이브러리를 올리며 한 번으로
  줄였다 — 같은 파일을 거듭 싣는 것은 전송 낭비 말고는 아무 뜻이 없다(D-130).
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: page('근태 확인 페이지', ${ {'/js/vendor/jquery-3.7.1.min.js', '/js/vendor/jquery-ui-1.13.3.min.js', '/js/bootjs/bootstrap.bundle.js', '/js/main/index.js', '/js/work/work.js'} })}">
</head>
<body>
<div class="wrap">

    <th:block th:replace="~{fragments/header :: header(${headerMenu}, ${currentUser})}"></th:block>

    <div class="content-wrap">
        <th:block th:replace="~{fragments/side-menu :: side(${sideMenu})}"></th:block>

        <div class="main-content-wrap">
            <div class="article">
                <div class="content">

                    <div th:replace="~{fragments/page-head :: head(|사용자 &gt; 근태 관리 &gt; 근태 확인|)}"></div>
                    <form name="workFrm">
                        <div class="header">
                            <div class="select-date">
                                <input type="month" th:min="${minMonth}" th:value="${month}">
                                <button type="button" class="btn btn-light date-search">검색</button>
                            </div>
                            <div class="search-option">
                                <select name="keyfield">
                                    <option value="">전체조회</option>
                                    <option value="dept">부서</option>
                                    <option value="name">이름</option>
                                </select>

                                <div class="main-search-container">
                                    <div class="main-search-border">
                                        <input class="main-search-text" type="search"
                                               placeholder="검색" aria-label="Search" name="keyword">
                                    </div>
                                    <div class="main-search-icon">
                                        <i class="fa-solid fa-magnifying-glass fa-lg" id="searchIcon"
                                           title="검색하기"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>

                    <!--/*
                      한 사람이 두 줄이다 — 1~16일, 17일~말일.

                      레거시는 통계를 그 두 줄에 따로 붙였고, 각각은 «그 줄만의»
                      합계였다. 나란히 놓여 있어 합계처럼 보이지만 아니고, 한 달 합계는
                      어디에도 없었다(D-077). 두 줄을 가로질러 한 번만 적는다(D-127).

                      사람마다 <tbody> 를 따로 둔다 — 줄무달이 줄이 아니라
                      사람을 가른다. 전에는 한 사람의 윗줄과 아랫줄 색이 달랐다.
                    */-->
                    <div class="section sheet-scroll">
                        <table class="table attendance-sheet">
                            <!--/*
                              너비를 여기서 정한다. 칸에 width 를 적어도 auto 배치는 그걸
                              «희망» 으로만 읽어 5rem 을 63px 로 깎았다. 그러면 고정된 칸의
                              left 값과 실제 너비가 어긋나 툴어진다. colgroup + fixed 는
                              적은 대로 준다(D-127).
                            */-->
                            <colgroup>
                                <col class="col-name">
                                <col class="col-dept">
                                <col class="col-job">
                                <col class="col-day" th:each="day : ${firstHeaders}">
                                <col class="col-tally">
                                <col class="col-tally">
                                <col class="col-tally">
                                <col class="col-tally">
                            </colgroup>
                            <thead>
                            <tr class="sheet-head">
                                <th colspan="3">구분</th>
                                <th th:each="day : ${firstHeaders}"
                                    th:class="${day.headerClass}" th:text="${day.label}">01</th>
                                <th colspan="4">통계 <span class="sheet-note">(한 달)</span></th>
                            </tr>
                            <tr class="sheet-head">
                                <th class="sheet-name">성명</th>
                                <th class="sheet-dept">부서</th>
                                <th class="sheet-job">직책</th>
                                <th:block th:each="day : ${secondHeaders}">
                                    <th th:if="${day.inMonth}"
                                        th:class="${day.headerClass}" th:text="${day.label}">17</th>
                                    <th th:unless="${day.inMonth}"></th>
                                </th:block>
                                <th>정상</th>
                                <th>지각</th>
                                <th>조퇴</th>
                                <th>연차</th>
                            </tr>
                            </thead>
                            <tbody th:each="row : ${rows}">
                            <tr th:with="tally=${row.sheet.total()}">
                                <td rowspan="2" class="sheet-name" th:text="${row.user.name}">성명</td>
                                <td rowspan="2" class="sheet-dept" th:text="${row.user.deptName}">부서</td>
                                <td rowspan="2" class="sheet-job" th:text="${row.user.jobName}">직책</td>
                                <td th:each="cell : ${row.sheet.first.cells}"
                                    th:class="${cell.cellClass()}" th:text="${cell.text}"></td>
                                <td rowspan="2" class="sheet-tally" th:text="${tally.normal}">0</td>
                                <td rowspan="2" class="sheet-tally" th:text="${tally.late}">0</td>
                                <td rowspan="2" class="sheet-tally" th:text="${tally.leave}">0</td>
                                <td rowspan="2" class="sheet-tally"
                                    th:text="${tally.vacationLabel()}">0.0</td>
                            </tr>
                            <tr>
                                <td th:each="cell : ${row.sheet.second.cells}"
                                    th:class="${cell.cellClass()}" th:text="${cell.text}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <!--/* 페이징 */-->
                    <div class="page-controller">
                        <a th:if="${page.hasPreviousBlock()}" class="disabled"
                           th:href="|javascript:block('${page.pagePerBlock}', '${page.nowBlock - 1}')|">이전</a>
                        <ul class="page-numbers">
                            <li th:each="number : ${page.pageNumbers}">
                                <a th:href="|javascript:paging('${number}')|"
                                   th:classappend="${number == page.nowPage} ? 'disabled'"
                                   th:text="${number}">1</a>
                            </li>
                        </ul>
                        <a th:if="${page.hasNextBlock()}"
                           th:href="|javascript:block('${page.pagePerBlock}', '${page.nowBlock + 1}')|">다음</a>
                    </div>
                    <form name="readFrm">
                        <input type="hidden" name="nowPage" th:value="${page.nowPage}">
                        <input type="hidden" name="date" th:value="${month}">
                        <input type="hidden" name="keyfield">
                        <input type="hidden" name="keyword">
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
