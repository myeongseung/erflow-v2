<!DOCTYPE html>
<!--/*
  결재라인 찾기 팝업.
  출처: legacy/ERFlow/src/main/webapp/findProposalRoute.jsp

  결재 등록 화면이 window.open 으로 여는 작은 창이다. 고른 값 셋(번호, 사번을 이은
  문자열, 이름)을 js/main/findProposalRoute.js 가 window.opener.receiveRouteInfo 에
  넘긴다.

  도움말과 꼬리말이 협력업체 찾기의 것이다. 레거시가 그 화면을 복사해 만들면서 글자를
  고치지 않았다. 그대로 옮긴다 — 화면에 그렇게 떠 있다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: page('결재라인 찾기', ${ {'/js/vendor/jquery-3.7.1.min.js', '/js/main/findProposalRoute.js'} })}">
</head>
<body>
<form th:action="@{/find/proposal-route}">
    <div class="page-box">
        <div class="search-box">
            <input type="text" name="search"
                   id="findProposalRoute-input" th:value="${search == null ? '' : search}"
                   placeholder="예)결재라인명을 검색해주세요.">
            <button type="submit">검색</button>
        </div>
        <hr>

        <!--/* 창을 처음 열었을 때. 검색어를 비운 채 누른 것과는 다르다. */-->
        <div class="tips" th:if="${entries == null}">
            <h3>tip</h3>
            <p>아래와 같은 조합으로 검색하면 더욱 정확한 검색 결과가 제공됩니다.</p>

            <div class="tip-item">
                <strong>협력업체 ID</strong><br> 예) 1 -&gt; 삼성
            </div>
            <div class="tip-item">
                <strong>협력업체 명</strong><br> 예) 삼성 -&gt; 1
            </div>
        </div>

        <div th:if="${entries != null}">
            <p th:each="entry : ${entries}">
                <!--/*
                  data-value 는 결재 순서대로 이은 사번이다. 레거시는 이 문자열을
                  쪼개 사용자마다 조회한 뒤 다시 이어 붙였다 — D-041 참조.
                */-->
                <a href="javascript:void(0);" class="a_route_info"
                   th:data-key="${entry.id}" th:data-value="${entry.route}"
                   th:data-name="${entry.nickname}"
                   th:text="${entry.id} + ' ' + ${entry.nickname}">29 나의 결재라인</a>
            </p>
        </div>

        <hr>

        <div class="footer">
            Powered by 권명승<br> © 협력업체 찾기 서비스 제공
        </div>
    </div>
    <input type="hidden" id="routeId" name="routeId">
    <input type="hidden" id="route" name="route">
</form>
</body>
</html>
