<!DOCTYPE html>
<!--/*
  협력업체 찾기 팝업.
  출처: legacy/ERFlow/src/main/webapp/findCompany.jsp

  업무 등록 화면이 window.open 으로 여는 작은 창이다. 고른 값은
  js/main/findCompany.js 가 window.opener.receiveCompanyInfo 로 돌려준다.

  도움말은 번호로도 찾을 수 있다고 안내하지만 검색은 이름만 훑는다. 레거시가
  그렇고 그대로 옮겼다 — D-039 참조.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>협력업체 찾기</title>
    <link rel="stylesheet" th:href="@{/css/main/findBank.css}">
    <script th:src="@{https://code.jquery.com/jquery-latest.min.js}"></script>
    <script th:src="@{/js/main/findCompany.js}"></script>
</head>
<body>
<form th:action="@{/find/company}">
    <div class="container">
        <div class="search-box">
            <input type="text" placeholder="예) 협력업체 ID or 협력업체 검색" name="search"
                   id="findCompany-input" th:value="${search == null ? '' : search}">
            <button type="submit">검색</button>
        </div>
        <hr>

        <!--/* 창을 처음 열었을 때. 검색어를 비운 채 누른 것과는 다르다. */-->
        <div class="tips" th:if="${entries == null}">
            <h3>tip</h3>
            <p>아래와 같은 조합으로 검색하면 더욱 정확한 검색 결과가 제공됩니다.</p>

            <div class="tip-item">
                <strong>협력업체 ID</strong><br> 예) 1 -&gt; 삼성
            </div>
            <div class="tip-item">
                <strong>협력업체 명</strong><br> 예) 삼성 -&gt; 1
            </div>
        </div>

        <div th:if="${entries != null}">
            <p th:each="entry : ${entries}">
                <a href="javascript:void(0);" class="a_company_info"
                   th:data-key="${entry.id}" th:data-value="${entry.name}"
                   th:text="${entry.id} + ' ' + ${entry.name}">1 삼성</a>
            </p>
        </div>

        <hr>

        <div class="footer">
            Powered by 권명승시치<br> © 협력업체 찾기 서비스 제공
        </div>
    </div>
    <input type="hidden" id="companyId" name="companyId">
    <input type="hidden" id="companyName" name="companyName">
</form>
</body>
</html>
