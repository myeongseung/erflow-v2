<!DOCTYPE html>
<!--/*
  제품 찾기 팝업 — 여러 개.
  출처: legacy/ERFlow/src/main/webapp/findMultiProduct.jsp

  업무 등록 화면이 window.open 으로 여는 작은 창이다. 고른 코드와 이름을 배열로
  묶어 js/main/findMultiProduct.js 가 window.opener.receiveMultiProductInfo 에
  넘긴다. 이름은 .search-people-body-product 셀에서 읽어 간다 — 셀 class 가 계약이다.

  레거시는 표의 </tbody></table> 을 닫지 않고 </div> 로 한꺼번에 끝낸다. 브라우저는
  그 자리에서 표를 닫으므로 DOM 은 여기 적은 것과 같다 — D-037 과 같은 판단이다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제품 찾기</title>
    <script th:src="@{https://code.jquery.com/jquery-latest.min.js}"></script>
    <script th:src="@{https://code.jquery.com/jquery-latest.min.js}"></script>
    <script th:src="@{/js/main/findMultiProduct.js}"></script>
    <link rel="stylesheet" th:href="@{/css/main/findBank.css}">
    <link rel="stylesheet" th:href="@{/css/bootcss/bootstrap.css}">
</head>
<body>
<form th:action="@{/find/multi-product}">
    <div class="container">
        <div class="search-box">
            <input type="text" placeholder="예) 제품 코드 or 제품 명 검색" name="search"
                   id="findWork-input" th:value="${search == null ? '' : search}">
            <button type="submit">검색</button>
        </div>
        <div class="select-box">
            <button type="button" class="btn btn-primary" id="select-button">확인</button>
        </div>
        <hr>

        <!--/* 창을 처음 열었을 때. 검색어를 비운 채 누른 것과는 다르다. */-->
        <div class="tips" th:if="${entries == null}">
            <h3>tip</h3>
            <p>아래와 같은 조합으로 검색하면 더욱 정확한 검색 결과가 제공됩니다.</p>

            <div class="tip-item">
                <strong>제품 코드</strong><br> 예) 031002 -&gt; 환공어묵
            </div>
            <div class="tip-item">
                <strong>제품 명</strong><br> 예) 환공어묵 -&gt; 031002
            </div>
        </div>

        <div class="product" th:if="${entries != null}">
            <table class="search-people-body table">
                <thead>
                <tr>
                    <th><input type="checkbox" id="chkAll"></th>
                    <th>제품번호</th>
                    <th>이름</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="entry : ${entries}">
                    <td class="search-people-body-check">
                        <input name="productId" type="checkbox" th:value="${entry.id}">
                    </td>
                    <td class="search-people-body-product-id" th:text="${entry.id}">031002</td>
                    <td class="search-people-body-product" th:text="${entry.name}">환공어묵</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="footer">
            Powered by 권명승<br> © 제품 코드 찾기 서비스 제공
        </div>
    </div>
    <!--/*
      이 숨은 입력의 name 이 체크박스와 같다. 그래서 «전체 선택» 을 맞추는 계산이
      한 칸씩 어긋난다 — 스크립트가 세는 input[name=productId] 에 이것까지 들어가
      전부 골라도 개수가 맞지 않는다. 레거시 그대로다. D-040 참조.
    */-->
    <input type="hidden" id="productId" name="productId">
    <input type="hidden" id="productName" name="productName">
</form>
</body>
</html>
