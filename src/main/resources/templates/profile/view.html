<!DOCTYPE html>
<!--/*
  프로필 보기.
  출처: legacy/ERFlow/src/main/webapp/profile.jsp

  왼쪽 카드에 Website·Github·Twitter·Instagram·Facebook 다섯 줄이 있었다. 값이 전부
  `bootdey` 였다 — 부트스트랩 견본의 글자 그대로이며 사용자 정보와 아무 상관이 없다.
  1단계는 «화면에 보이는 것이므로 옮긴다» 로 두었지만, 이제 화면은 우리가 정한다.
  지웠다(D-122).

  아래 근무 현황 표는 한 달을 두 줄로 나눠 그린다(1~16일 / 17~말일). 오른쪽
  «정상·지각·조퇴·연차» 는 그 줄만의 합계다(D-077).
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: page('[[${owner.name}]]님의 프로필', ${ {'/js/vendor/jquery-3.7.1.min.js', '/js/vendor/jquery-ui-1.13.3.min.js', '/js/bootjs/bootstrap.bundle.js', '/js/main/index.js', '/js/main/profile.js'} })}">
</head>
<!--/* 레거시는 이 화면만 본문 바탕을 회색으로 박아 두었다. 바탕색은 이제
       디자인 시스템이 정한다 — 화면마다 다르면 그것이 결함으로 보인다(D-119). */-->
<body>
<th:block th:replace="~{fragments/header :: header(${headerMenu}, ${currentUser})}"></th:block>

<div class="content-wrap">
    <th:block th:replace="~{fragments/side-menu :: side(${sideMenu})}"></th:block>

    <div class="page-box">
        <div class="main-body">

            <div th:replace="~{fragments/page-head :: head(|사용자 &gt; ${owner.name}님의 프로필|)}"></div>

            <div class="profile-layout">
                <aside class="profile-side">
                    <div class="card profile-identity">
                        <!--/*
                          전에는 bootdey.com 의 견본 아바타를 직접 링크했다 — 남의
                          사이트 그림이고 그쪽이 내리면 깨진다(D-119). 사람 사진이
                          없는 자리이므로 자리표시로 둔다.
                        */-->
                        <div class="avatar-placeholder">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <h4 class="profile-name">[[${owner.name}]]</h4>
                        <p class="profile-motto">중요한 것은<br>꺾이지 않는 마음!</p>
                        <div class="btn-group">
                            <button class="btn btn-primary" id="search-button">주소록</button>
                            <button class="btn message-btn"
                                    th:attr="data-id=${owner.id}">쪽지 </button>
                        </div>
                    </div>
                </aside>

                <div class="profile-main">
                    <div class="card">
                        <!--/*
                          레거시는 이 다섯 줄을 부트스트랩 격자(row + col-sm-3/9)로
                          짰다. 그 격자를 쓰는 화면이 이 하나뿐이라 12칸 격자를
                          되살리는 대신 «라벨과 값» 목록으로 바꿨다(D-122).
                        */-->
                        <dl class="info-list">
                            <div class="info-row">
                                <dt>이름</dt>
                                <dd>[[${owner.name}]]</dd>
                            </div>
                            <div class="info-row">
                                <dt>이메일</dt>
                                <dd>[[${owner.emailText}]]</dd>
                            </div>
                            <div class="info-row">
                                <dt>내선 전화</dt>
                                <dd>[[${owner.extensionPhoneText}]]</dd>
                            </div>
                            <div class="info-row">
                                <dt>개인 전화</dt>
                                <dd>[[${owner.mobilePhoneText}]]</dd>
                            </div>
                            <div class="info-row">
                                <dt>주소</dt>
                                <dd>[[${owner.addressText}]]</dd>
                            </div>
                        </dl>
                        <!--/* 자기 프로필에서만 보인다. 남의 프로필에는 이 자리가 빈다. */-->
                        <a th:if="${editable}" class="btn btn-primary"
                           th:href="@{/profile/password-check}">Edit</a>
                    </div>

                    <div>
                        <div class="card">
                            <div class="card-body">
                                <form>
                                    <div class="header">
                                        <div class="date">
                                            <p class="work-title" style="font-size: 24px">이번 달 근무 현황</p>
                                            <!--/* 하한은 언제나 올해 1월이다. 다른 달을 보고 있어도 움직이지 않는다. */-->
                                            <input type="month" id="monthPicker"
                                                   th:min="${minMonth}" th:value="${month}">
                                        </div>
                                    </div>
                                </form>

                                <table class="table table-bordered">
                                    <tr>
                                        <th th:each="day : ${calendar.firstHalf.days}"
                                            th:class="${day.headerClass}">[[${day.label}]]</th>
                                        <!--/*
                                          레거시는 colspan="5" 였다. 그런데 통계
                                          칸은 «정상·지각·조퇴·연차» 넷이다 —
                                          머리글이 없는 칸 하나를 더 선언한 셈이고,
                                          그만큼 표가 제 몸보다 넓어져 맨 오른쪽
                                          «연차» 가 잘렸다. 넷으로 맞춘다(D-122).
                                        */-->
                                        <th colspan="4">통계 <span class="sheet-note">(한 달)</span></th>
                                    </tr>
                                    <tr>
                                        <th:block th:each="day : ${calendar.secondHalf.days}">
                                            <th th:if="${day.inMonth}"
                                                th:class="${day.headerClass}">[[${day.label}]]</th>
                                            <th th:unless="${day.inMonth}"></th>
                                        </th:block>
                                        <th>정상</th>
                                        <th>지각</th>
                                        <th>조퇴</th>
                                        <th>연차</th>
                                    </tr>
                                    <!--/*
                                      레거시는 통계를 두 줄에 따로 붙였고, 각각은
                                      «그 줄만의» 합계였다. 위아래로 나란히 놓여
                                      합계처럼 보였지만 아니고, 한 달 합계는 화면 어디에도
                                      없었다(D-077). 두 줄을 가로질러 한 번만 적는다(D-127).
                                    */-->
                                    <tr th:with="tally=${calendar.total()}">
                                        <td th:each="day : ${calendar.firstHalf.days}"
                                            th:class="${day.cellClass}"></td>
                                        <td rowspan="2" class="sheet-tally"
                                            th:text="${tally.normal}">0</td>
                                        <td rowspan="2" class="sheet-tally"
                                            th:text="${tally.late}">0</td>
                                        <td rowspan="2" class="sheet-tally"
                                            th:text="${tally.leave}">0</td>
                                        <td rowspan="2" class="sheet-tally"
                                            th:text="${tally.vacationLabel()}">0.0</td>
                                    </tr>
                                    <tr>
                                        <td th:each="day : ${calendar.secondHalf.days}"
                                            th:class="${day.cellClass}"></td>
                                    </tr>
                                </table>
                                <!--/*
                                  레거시는 범례 다섯 칸을 손으로 적었다. 그래서 반차가
                                  빠져 있었고(달력에는 칠해지는데 범례에 없었다), 게다가
                                  연차와 같은 #dbdbdb 라 구분도 안 됐다. 상태 목록에서
                                  그려 어긋나갈 자리를 없쥜다(D-125).
                                */-->
                                <div class="work-title-color">
                                    <div class="box-wrapper" th:each="status : ${statuses}">
                                        <div class="work-swatch"
                                             th:classappend="${status.styleClass}"></div>
                                        <p th:text="${status.label}">상태</p>
                                    </div>
                                </div>
                                <!--/*
                                  달을 고치거나 주소록에서 사람을 고르면 이 폼이 제출된다.
                                  action 이 없어 지금 주소로 다시 열린다.
                                */-->
                                <form name="readFrm">
                                    <input type="hidden" name="id" th:value="${owner.id}">
                                    <input type="hidden" name="date" th:value="${month}">
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
