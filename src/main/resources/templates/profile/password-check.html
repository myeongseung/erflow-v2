<!DOCTYPE html>
<!--/*
  비밀번호 재확인.
  출처: legacy/ERFlow/src/main/webapp/passwordCheck.jsp

  버튼이 하나뿐이고 그 하나가 «이전페이지» 다. 확인 버튼은 없다 — 비밀번호 칸에서
  엔터를 쳐야 제출된다. 그 «이전페이지» 버튼도 form 안에 있어 type 이 submit 이고,
  안에 링크가 들어 있어 누르면 제출과 이동이 동시에 일어난다. 레거시 그대로다.

  레거시는 이 확인을 통과하지 않아도 수정 화면이 그냥 열렸다(D-079). 2단계에서
  진짜 문으로 만들었다(D-111) — 통과하면 세션에 표가 남고, 수정 화면과 처리가
  그 표를 요구한다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 입력</title>
    <script th:src="@{https://code.jquery.com/jquery-latest.min.js}"></script>
    <script th:src="@{https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.9.2/umd/popper.min.js}" integrity="sha512-2rNj2KJ+D8s1ceNasTIex6z4HWyOnEYLVC3FigGOmyQCZc2eBXKgOxQmo3oKLHyfcj53uz4QMsRCWNbLd32Q1g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" th:href="@{/css/bootcss/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/css/permissionError.css}">
</head>
<body>
<form th:action="@{/profile/password-check-proc}" method="post">
    <div class="error-container">
        <div class="error-title">비밀번호를 재입력 해주세요.</div>
        <input class="form-control form-control-lg" type="password"
               placeholder="password" name="password">
        <button class="error-button"><a th:href="@{/profile(id=${userId})}">이전페이지</a></button>
    </div>
</form>
</body>
</html>
