<!DOCTYPE html>
<!--/*
  비밀번호 초기화 결과 (D-134). 레거시에 없던 화면이다.

  임시 비밀번호 평문이 보이는 유일한 자리다 — DB 에는 해시만 남아 다시 조회할 길이
  없고, 이 화면을 떠나면 끝이다. 관리자가 이 값을 본인에게 직접 전달한다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: page('비밀번호 초기화', ${ {'/js/vendor/jquery-3.7.1.min.js', '/js/admin/admin.js'} })}">
</head>
<body>
<th:block th:replace="~{fragments/header :: header(${headerMenu}, ${currentUser})}"></th:block>

<div class="content-wrap">
    <th:block th:replace="~{fragments/admin-side :: side}"></th:block>

    <div class="admin-main-content">
        <div class="table-wrap">
            <div th:replace="~{fragments/page-head :: head(|관리자 &gt; 사원 &gt; 비밀번호 초기화|)}"></div>

            <div class="reset-password-result">
                <p th:text="|${reset.name}(${reset.id}) 사원의 비밀번호를 임시 값으로 바꿨습니다.|">
                    홍길동(1001) 사원의 비밀번호를 임시 값으로 바꿨습니다.</p>
                <p class="reset-password-value"><strong th:text="${reset.password}">Xk7m-Qp2w</strong></p>
                <p>이 화면을 떠나면 임시 비밀번호를 다시 볼 수 없습니다.
                    본인에게 직접 전달해 주세요.</p>
                <p>본인이 임시 비밀번호로 로그인하면 곧장 비밀번호 변경 화면으로 갑니다 —
                    새 비밀번호를 정하기 전에는 다른 화면을 열 수 없습니다.</p>
                <div class="btn-group">
                    <a class="btn btn-primary" th:href="@{/admin/user/list}">사원 리스트로 돌아가기</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
