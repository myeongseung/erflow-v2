<!DOCTYPE html>
<!--/*
  사원 추가.
  출처: legacy/ERFlow/src/main/webapp/admin/user/userRegister.jsp

  주소는 다음 우편번호 서비스(postcode.v2.js)가 채운다. js/admin/location.js 가
  .btn_execDaumPostcode 에 걸려 있고, 채우는 자리를 id 로 찾는다 —
  sample6_postcode / sample6_address / sample6_extraAddress / sample6_detailAddress.
  그래서 그 id 들을 그대로 둔다.

  **레거시에 있던 인라인 <script> 하나를 옮기지 않았다.** 같은 버튼에 다시 핸들러를
  걸려던 조각인데 `#btn_execDaumPostcode` 라는 id 를 찾는다. 그런 id 는 이 화면에
  없다(버튼은 class 다). 한 번도 걸린 적이 없는 코드이고 화면에 보이지도 않는다.

  «주민 번호» 와 «휴대 전화» 입력이 같은 id(input8)를 쓴다. 레거시가 label 을 둘 다
  for="input8" 로 걸어 두어, 화면 낭독기에는 둘 다 같은 이름으로 읽힌다. 정답에도
  그렇게 잡혀 있으므로 id 를 고치지 않는다 — 고치면 대조가 어긋난다.

  입력한 주소와 휴대 전화는 저장되지 않는다(D-057). 화면은 레거시 그대로 둔다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: page('관리자 페이지', ${ {'/js/vendor/jquery-3.7.1.min.js', '//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js', '/js/admin/admin.js', '/js/admin/location.js'} })}">
</head>
<body>
<th:block th:replace="~{fragments/header :: header(${headerMenu}, ${currentUser})}"></th:block>

<div class="content-wrap">
    <th:block th:replace="~{fragments/admin-side :: side}"></th:block>

    <div class="admin-main-content">
        <div class="user-insert-wrap">
            <div th:replace="~{fragments/page-head :: head(|관리자 &gt; 사원 &gt; 사원추가|)}"></div>
            <div class="user-insert">
                <div class="user-form">
                    <form th:action="@{/admin/user/register-proc}" method="post">
                        <div class="form-group">
                            <label for="input1">사원 번호:</label> <input type="text" id="input1"
                                name="id" placeholder="사원 번호">
                        </div>
                        <div class="form-group">
                            <label for="input2">이름:</label> <input type="text" id="input2"
                                name="name" placeholder="사원 이름">
                        </div>
                        <div class="form-group">
                            <label for="input8">주민 번호:</label> <input type="text" id="input8"
                                name="socialNumber" placeholder="ex)990115-1234567">
                        </div>
                        <div class="form-group">
                            <label for="input3">Email</label> <input type="email" id="input3"
                                name="email" placeholder="사원 이메일">
                        </div>
                        <div class="form-group">
                            <label for="input4">사원 주소:</label> <input type="text"
                                id="sample6_postcode" placeholder="우편번호" name="postalCode" readonly>
                            <input type="text" id="sample6_extraAddress" placeholder="동/읍/면" readonly>
                            <input type="button" class="btn_execDaumPostcode" value="우편 찾기">
                            <input type="text" id="sample6_address" placeholder="도로명 주소" name="address1"><br>
                            <input type="text" id="sample6_detailAddress" placeholder="상세주소" name="address2">

                        </div>
                        <div class="form-group">
                            <label for="job">직급</label> <select name="job" id="job">
                                <option th:each="job : ${options.jobs}"
                                        th:value="${job.id}" th:text="${job.name}">직급</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="dept">부서</label> <select name="dept" id="dept">
                                <option th:each="dept : ${options.departments}"
                                        th:value="${dept.id}" th:text="${dept.name}">부서</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="input7">내선 번호</label> <input type="text" id="input7"
                                name="extensionPhone" placeholder="사원 내선 번호">
                        </div>
                        <div class="form-group">
                            <label for="input8">휴대 전화</label> <input type="text" id="input8"
                                name="mobilePhone" placeholder="휴대 전화">
                        </div>
                        <div class="btn-group">
                            <button class="userRegister-btn" type="submit">사원 생성</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
