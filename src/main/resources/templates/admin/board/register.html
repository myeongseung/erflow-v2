<!DOCTYPE html>
<!--/*
  게시판 생성 (팝업).
  출처: legacy/ERFlow/src/main/webapp/admin/board/boardRegister.jsp

  목록의 «생성» 이 window.open 으로 여는 작은 창이다. 새 게시판은 권한 네 칸이
  관리자 비트로 시작한다 — 만든 뒤 권한 수정 화면에서 열어 준다.

  **레거시는 이 화면에 권한 검사가 없다.** 처리(Proc)에만 있다. 우리는 /admin/**
  이 통째로 막는다(D-053).
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: page('게시판 생성', ${ {'/js/vendor/jquery-3.7.1.min.js', '/js/admin/boardRegister.js', '/js/bootjs/bootstrap.bundle.js'} })}">
</head>
<body>
<div class="message-wrap">
    <div class="readmessage-body">
        <form name="boardFrm" th:action="@{/admin/board/register-proc}" method="post">
            <table class="readmessage-info">
                <tr>
                    <td>
                        <div class="input-group mb-3">
                            <div class="new-name"><span class="input-group-text">게시판 이름</span></div>
                            <input type="text" name="subject" class="form-control new-name" placeholder="** 게시판">
                        </div>
                    </td>
                </tr>
            </table>
            <hr>
            <div class="readmessage-footer">
                <div class="readmessage-footer-button">
                    <button class="btn btn-primary" type="submit">생성</button>
                    <button class="btn btn-danger cancel-board" type="button">취소</button>
                </div>
            </div>
        </form>
    </div>
</div>
</body>
</html>
