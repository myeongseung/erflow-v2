<!DOCTYPE html>
<!--/*
  직급·부서 관리 — 목록·추가·수정이 한 화면이다(D-149).
  출처: admin/permission/jobDeptList.jsp + jobRegister.jsp + deptRegister.jsp
        + jobUpdate.jsp + deptUpdate.jsp

  관리자 목록 틀(D-148)을 카드 둘로 — 직급 카드와 부서 카드가 나란히 서고 각자
  도구줄(추가·삭제, 검색)을 갖는다. 추가 폼은 대화상자(#job-add, #dept-add)이고,
  수정은 /job-update?jobId= · /dept-update?deptId= 로 들어오면 그 줄의 대화상자
  (#job-edit, #dept-edit)가 열린 채로 그려진다.

  삭제는 체크박스로 고른 줄을 보낸다. 체크박스와 «삭제» 단추는 카드 안의 빈 폼
  (jobFrm·deptFrm)에 form 속성으로 묶인다 — 검색 폼과 겹치지 않게.

  «겸하는 권한» 칸은 수정 대화상자의 체크와 같은 값이다(D-149).
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: page('직급·부서 관리', ${ {'/js/vendor/jquery-3.7.1.min.js', '//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js', '/js/admin/admin.js', '/js/admin/location.js', '/js/admin/permissions.js', '/js/admin/jobDeptList.js', '/js/common/dialog.js'} })}">
</head>
<body>
<th:block th:replace="~{fragments/header :: header(${headerMenu}, ${currentUser})}"></th:block>
<div class="content-wrap">
    <th:block th:replace="~{fragments/admin-side :: side}"></th:block>
    <div class="admin-main-content">
        <div class="admin-page">
            <div th:replace="~{fragments/page-head :: head(|관리자 &gt; 권한 관리 &gt; 직급·부서 관리|)}"></div>

            <div class="list-grid">
                <section class="list-card">
                    <div class="toolbar">
                        <div class="toolbar-actions">
                            <h2 class="card-title">직급</h2>
                            <button type="button" class="btn btn-primary" data-dialog-open="job-add">직급 추가</button>
                            <button type="submit" class="btn btn-danger" form="jobFrm">삭제</button>
                        </div>
                        <form class="toolbar-search" th:action="@{/admin/permission/job-dept-list}" method="get">
                            <input type="hidden" name="deptKeyword" th:value="${deptKeyword}">
                            <div class="main-search-container">
                                <div class="main-search-border">
                                    <input class="main-search-text" type="search" name="jobKeyword"
                                           placeholder="직급 검색" aria-label="직급 검색어" th:value="${jobKeyword}">
                                </div>
                                <div class="main-search-icon">
                                    <i class="fa-solid fa-magnifying-glass fa-lg" title="검색하기"></i>
                                </div>
                            </div>
                        </form>
                    </div>
                    <form id="jobFrm" th:action="@{/admin/permission/job-delete-proc}" method="post"
                          onsubmit="return confirm('선택한 직급을 삭제할까요?');"></form>
                    <div class="table-scroll">
                        <table class="table table-striped">
                            <thead>
                            <tr>
                                <th class="check-col"><input type="checkbox" data-check-all="jobId" aria-label="직급 전체 선택"></th>
                                <th scope="col">직급</th>
                                <th scope="col">겸하는 권한</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="job : ${jobs}">
                                <td class="check-col"><input type="checkbox" name="jobId" form="jobFrm" th:value="${job.classId}"></td>
                                <td><a th:href="@{/admin/permission/job-update(jobId=${job.classId})}" th:text="${job.name}">직급명</a></td>
                                <td th:text="${jobGrants[job.classId] ?: '-'}">-</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <section class="list-card">
                    <div class="toolbar">
                        <div class="toolbar-actions">
                            <h2 class="card-title">부서</h2>
                            <button type="button" class="btn btn-primary" data-dialog-open="dept-add">부서 추가</button>
                            <button type="submit" class="btn btn-danger" form="deptFrm">삭제</button>
                        </div>
                        <form class="toolbar-search" th:action="@{/admin/permission/job-dept-list}" method="get">
                            <input type="hidden" name="jobKeyword" th:value="${jobKeyword}">
                            <div class="main-search-container">
                                <div class="main-search-border">
                                    <input class="main-search-text" type="search" name="deptKeyword"
                                           placeholder="부서 검색" aria-label="부서 검색어" th:value="${deptKeyword}">
                                </div>
                                <div class="main-search-icon">
                                    <i class="fa-solid fa-magnifying-glass fa-lg" title="검색하기"></i>
                                </div>
                            </div>
                        </form>
                    </div>
                    <form id="deptFrm" th:action="@{/admin/permission/dept-delete-proc}" method="post"
                          onsubmit="return confirm('선택한 부서를 삭제할까요?');"></form>
                    <div class="table-scroll">
                        <table class="table table-striped">
                            <thead>
                            <tr>
                                <th class="check-col"><input type="checkbox" data-check-all="deptId" aria-label="부서 전체 선택"></th>
                                <th scope="col">부서</th>
                                <th scope="col">겸하는 권한</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="dept : ${depts}">
                                <td class="check-col"><input type="checkbox" name="deptId" form="deptFrm" th:value="${dept.classId}"></td>
                                <td><a th:href="@{/admin/permission/dept-update(deptId=${dept.classId})}" th:text="${dept.name}">부서명</a></td>
                                <td th:text="${deptGrants[dept.classId] ?: '-'}">-</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>

            <!--/* 직급 추가. 만들면 비어 있는 비트 자리를 하나 받는다(Levels.next). */-->
            <dialog id="job-add" class="dialog" th:data-open-on-load="${openAdd == 'job'} ? 'true' : null">
                <form th:action="@{/admin/permission/job-register-proc}" method="post">
                    <div class="dialog-head">
                        <h2 class="dialog-title">직급 추가</h2>
                        <button type="button" class="dialog-close" data-dialog-close aria-label="닫기">
                            <i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="dialog-body">
                        <div class="form-group">
                            <label for="job-add-name">직급명</label>
                            <input type="text" id="job-add-name" name="jobName" placeholder="직급명" autofocus>
                        </div>
                    </div>
                    <div class="btn-group dialog-foot">
                        <button type="button" class="btn" data-dialog-close>취소</button>
                        <button class="btn btn-primary" type="submit">직급 생성</button>
                    </div>
                </form>
            </dialog>

            <!--/* 부서 추가. 주소는 다음 우편번호 서비스가 채운다(js/admin/location.js). */-->
            <dialog id="dept-add" class="dialog" th:data-open-on-load="${openAdd == 'dept'} ? 'true' : null">
                <form th:action="@{/admin/permission/dept-register-proc}" method="post">
                    <div class="dialog-head">
                        <h2 class="dialog-title">부서 추가</h2>
                        <button type="button" class="dialog-close" data-dialog-close aria-label="닫기">
                            <i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="dialog-body">
                        <div class="form-group">
                            <label for="dept-add-name">부서명</label>
                            <input type="text" id="dept-add-name" name="deptName" placeholder="부서명" autofocus>
                        </div>
                        <div class="form-group">
                            <label for="dept-add-postcode">부서 주소</label>
                            <div class="address-group">
                                <div class="address-line">
                                    <input type="text" id="dept-add-postcode" placeholder="우편번호" name="postalCode" readonly>
                                    <button type="button" class="btn btn_execDaumPostcode">우편번호 찾기</button>
                                </div>
                                <input type="text" placeholder="도로명 주소" name="address1" aria-label="도로명 주소" readonly>
                                <input type="text" placeholder="참고항목 (동/읍/면)" aria-label="참고항목" readonly>
                                <input type="text" placeholder="상세주소" name="address2" aria-label="상세주소">
                            </div>
                        </div>
                    </div>
                    <div class="btn-group dialog-foot">
                        <button type="button" class="btn" data-dialog-close>취소</button>
                        <button class="btn btn-primary" type="submit">부서 생성</button>
                    </div>
                </form>
            </dialog>

            <!--/*
              직급 수정. 체크박스는 자기 자신을 뺀 나머지 직급이고, 이미 가진 비트에
              체크가 켜져 있다. 저장하면 «자기 비트 + 체크된 비트» 가 된다 — 체크를 다
              지워도 자기 자신은 남는다. 전체 선택은 js/admin/permissions.js.
            */-->
            <dialog id="job-edit" class="dialog" th:if="${jobForm != null}" data-open-on-load="true">
                <form th:action="@{/admin/permission/job-update-proc}" method="post">
                    <div class="dialog-head">
                        <h2 class="dialog-title">직급 수정</h2>
                        <button type="button" class="dialog-close" data-dialog-close aria-label="닫기">
                            <i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="dialog-body">
                        <input type="hidden" name="jobId" th:value="${jobForm.id}">
                        <div class="form-group">
                            <label for="job-edit-name">직급명</label>
                            <input type="text" id="job-edit-name" name="jobName" th:value="${jobForm.name}" autofocus>
                        </div>
                        <div class="checkbox-container">
                            <label>겸하는 권한</label>
                            <div class="input-group">
                                <input type="checkbox" id="chkAll">
                                <label for="chkAll">전체 선택</label>
                            </div>
                            <div class="input-group" th:each="choice, i : ${jobForm.choices}">
                                <input type="checkbox" th:id="|permission${i.count}|"
                                       name="permissions" th:value="${choice.classId}"
                                       th:checked="${choice.checked}">
                                <label th:for="|permission${i.count}|" th:text="${choice.name}">직급</label>
                            </div>
                        </div>
                    </div>
                    <div class="btn-group dialog-foot">
                        <button type="button" class="btn" data-dialog-close>취소</button>
                        <button class="btn btn-primary" type="submit">저장</button>
                    </div>
                </form>
            </dialog>

            <!--/* 부서 수정. 직급 수정과 같은 규칙에 주소가 붙는다. 주소칸은 현재 값을
                   채워 준다 — 비워 두면 저장할 때 주소가 지워졌다(D-059 → D-105). */-->
            <dialog id="dept-edit" class="dialog" th:if="${deptForm != null}" data-open-on-load="true">
                <form th:action="@{/admin/permission/dept-update-proc}" method="post">
                    <div class="dialog-head">
                        <h2 class="dialog-title">부서 수정</h2>
                        <button type="button" class="dialog-close" data-dialog-close aria-label="닫기">
                            <i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="dialog-body">
                        <input type="hidden" name="deptId" th:value="${deptForm.dept.id}">
                        <div class="form-group">
                            <label for="dept-edit-name">부서명</label>
                            <input type="text" id="dept-edit-name" name="deptName" th:value="${deptForm.dept.name}" autofocus>
                        </div>
                        <div class="form-group">
                            <label for="dept-edit-postcode">부서 주소</label>
                            <div class="address-group">
                                <div class="address-line">
                                    <input type="text" id="dept-edit-postcode" placeholder="우편번호" name="postalCode"
                                           th:value="${deptForm.dept.postalCode}" readonly>
                                    <button type="button" class="btn btn_execDaumPostcode">우편번호 찾기</button>
                                </div>
                                <input type="text" placeholder="도로명 주소" name="address1" aria-label="도로명 주소"
                                       th:value="${deptForm.dept.address1}" readonly>
                                <input type="text" placeholder="참고항목 (동/읍/면)" aria-label="참고항목" readonly>
                                <input type="text" placeholder="상세주소" name="address2" aria-label="상세주소"
                                       th:value="${deptForm.dept.address2}">
                            </div>
                        </div>
                        <div class="checkbox-container">
                            <label>겸하는 권한</label>
                            <div class="input-group">
                                <input type="checkbox" id="chkAll">
                                <label for="chkAll">전체 선택</label>
                            </div>
                            <div class="input-group" th:each="choice, i : ${deptForm.choices}">
                                <input type="checkbox" th:id="|permission${i.count}|"
                                       name="permissions" th:value="${choice.classId}"
                                       th:checked="${choice.checked}">
                                <label th:for="|permission${i.count}|" th:text="${choice.name}">부서</label>
                            </div>
                        </div>
                    </div>
                    <div class="btn-group dialog-foot">
                        <button type="button" class="btn" data-dialog-close>취소</button>
                        <button class="btn btn-primary" type="submit">저장</button>
                    </div>
                </form>
            </dialog>
        </div>
    </div>
</div>
</body>
</html>
