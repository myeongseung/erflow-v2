<!DOCTYPE html>
<!--/*
  프로그램 부서 권한 수정.
  출처: legacy/ERFlow/src/main/webapp/admin/permission/programDeptUpdate.jsp

  직급·부서 수정 화면과 달리 **모든 부서**가 체크박스로 나온다. 빼야 할 «자기 자신» 이
  없기 때문이다. 저장값은 «관리자 비트 + 체크된 비트» 라, 체크를 다 지워도 관리자는
  남는다 — 관리자 부서는 목록에 나오지도 않아 이 화면에서 뺄 방법이 아예 없다.

  레거시 폼에는 method 가 없어 GET 이었다. POST 로 바꿨다(D-065).
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로그램 부서 권한 수정 페이지</title>
    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin/jobRegister.css}">
    <script th:src="@{https://code.jquery.com/jquery-latest.min.js}"></script>
    <script th:src="@{/js/admin/permissions.js}"></script>
</head>
<body>

<div class="container">
    <form th:action="@{/admin/permission/program-dept-update-proc}" method="post">
        <input type="hidden" id="programId" name="programId" th:value="${form.program.id}">
        <h2>프로그램 부서 권한 수정</h2>

        <label for="deptName">프로그램명:</label>
        <input type="text" id="deptName" name="deptName"
               th:value="${form.program.programName}" disabled>

        <div class="checkbox-container">
            <label>프로그램 부서 권한:</label><br>
            <div class="input-group">
                <input type="checkbox" id="chkAll">
                <label for="chkAll">전체 선택</label>
            </div>
            <br>
            <div class="input-group" th:each="choice, i : ${form.choices}">
                <input type="checkbox" id="permission" th:id="|permission${i.count}|"
                       name="permissions" th:value="${choice.classId}"
                       th:checked="${choice.checked}">
                <label for="permission" th:for="|permission${i.count}|">[[${choice.name}]]</label>
            </div>
        </div>
        <button type="submit">수정하기</button>
    </form>

</div>

</body>
</html>
