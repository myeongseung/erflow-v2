<!DOCTYPE html>
<!--/*
  문서 양식 추가·수정 (D-155).
  출처: legacy/ERFlow/src/main/webapp/admin/document/documentFormRegister.jsp

  숨은 flag 가 insert/update 를 가르고, 추가일 때 숨은 id 는 -1 이다.
  본문은 편집기(js/common/editor.js, D-120)가 만든다. 파일 선택은 .html 을 읽어
  편집기에 부어 넣는 것이라 서버로 올라가지 않는다(js/admin/documentFormRegister.js).
  편집기가 넓어야 해서 대화상자가 아니라 화면이다 — 폼 카드만 64rem 으로 넓힌다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: page('문서 양식 작성', ${ {'/js/vendor/jquery-3.7.1.min.js', '/js/vendor/jodit-4.13.23.min.js', '/js/admin/admin.js', '/js/admin/documentFormRegister.js', '/js/common/editor.js'} })}">
</head>
<body th:insert="~{fragments/admin-shell :: shell(|관리자 &gt; 문서 관리 &gt; 문서 양식 &gt; ${flag == 'update' ? '양식 수정' : '양식 추가'}|, null, ~{::content})}">
<th:block th:fragment="content">
    <form class="template-form" th:action="@{/admin/document/form-register-proc}" method="post">
        <input type="hidden" name="id" th:value="${templateId}">
        <input type="hidden" name="flag" th:value="${flag}">
        <div class="form-group">
            <label for="subject">양식명</label>
            <input type="text" id="subject" name="subject" th:value="${subject}" placeholder="예: 휴가 신청서" autofocus>
        </div>
        <div class="form-group">
            <label for="html-selector">HTML 파일에서 불러오기</label>
            <input type="file" id="html-selector" accept=".htm, .html">
            <p class="form-note">고른 파일의 내용이 아래 본문에 들어갑니다. 파일은 서버로 올라가지 않습니다.</p>
        </div>
        <div class="form-group">
            <label for="editor1">본문</label>
            <textarea id="editor1" name="content" rows="10" cols="80" th:text="${content}"></textarea>
        </div>
        <div class="btn-group">
            <a class="btn" th:href="@{/admin/document/form-list}">취소</a>
            <button class="btn btn-primary" type="submit">저장</button>
        </div>
    </form>
</th:block>
</body>
</html>
