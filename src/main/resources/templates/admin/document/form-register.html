<!DOCTYPE html>
<!--/*
  문서 양식 작성. 추가와 수정을 겸한다.
  출처: legacy/ERFlow/src/main/webapp/admin/document/documentFormRegister.jsp

  숨은 flag 가 insert/update 를 가른다. 화면 글자는 둘 다 «문서 양식 추가» 이고,
  추가일 때 숨은 id 는 -1 이다. 레거시 그대로다.

  본문은 편집기가 만든다. 파일 선택은 .html 을 읽어 편집기에 부어 넣는 것이라
  서버로 올라가지 않는다 — js/admin/documentFormRegister.js.

  레거시는 화면 안에 CKEDITOR.replace 를 적어 편집기 크기를 여기서 정했다.
  편집기를 Jodit 으로 바꾸면서 그 설정을 js/common/editor.js 한 곳으로 모았다
  (D-120) — 다섯 화면이 같은 편집기를 쓰는데 설정이 화면마다 흩어져 있을 이유가
  없다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: page('문서 양식 작성', ${ {'/js/vendor/jquery-3.7.1.min.js', '/js/vendor/jodit-4.13.23.min.js', '/js/admin/admin.js', '/js/admin/documentFormRegister.js', '/js/bootjs/bootstrap.bundle.js', '/js/common/editor.js'} })}">
</head>
<body>
<th:block th:replace="~{fragments/header :: header(${headerMenu}, ${currentUser})}"></th:block>

<div class="content-wrap">
    <th:block th:replace="~{fragments/admin-side :: side}"></th:block>

    <div class="admin-main-content">
        <div class="body">
            <div th:replace="~{fragments/page-head :: head(|관리자 &gt; 문서 관리 &gt; 문서 양식 추가|)}"></div>
            <div class="section">
                <form th:action="@{/admin/document/form-register-proc}" method="post">
                    <input type="hidden" name="id" th:value="${templateId}">
                    <input type="hidden" name="flag" th:value="${flag}">
                    <ul class="column">
                        <li class="title">양식명</li>
                        <li><input class="form-control form-control-lg" type="text" name="subject"
                                   th:value="${subject}">
                        </li>
                    </ul>
                    <textarea id="editor1" name="content" class="ckeditor-textarea"
                              rows="10" cols="80" th:text="${content}"></textarea>
                    <input type="file" id="html-selector" accept=".htm, .html">
                    <h2>
                        <input type="submit" value="확인"/> <input type="reset" value="다시입력"/>
                    </h2>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
