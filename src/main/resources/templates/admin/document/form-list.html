<!DOCTYPE html>
<!--/*
  문서 양식 리스트.
  출처: legacy/ERFlow/src/main/webapp/admin/document/documentFormList.jsp

  «보기» 는 부트스트랩 모달을 연다. 그런데 **모달이 줄마다 하나씩 생기는데 id 가 전부
  같다**(calendar-plus). 버튼도 그 id 를 가리키므로 어느 줄의 보기를 눌러도 첫 줄의
  양식이 뜬다(D-066). 레거시 그대로 옮긴다.

  이 화면만 bootstrap2.css 를 읽는다. bootstrap.css 와 `border-width: 0` 한 줄만
  다른 같은 5.3.1 이라 공통 목록과 같은 파일을 쓴다(결재 문서 보기와 같은 판단).
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문서 양식 리스트</title>
    <script th:src="@{https://code.jquery.com/jquery-latest.min.js}"></script>
    <script th:src="@{/js/bootjs/bootstrap.js}"></script>
    <script th:src="@{/js/admin/admin.js}"></script>
    <script th:src="@{/js/admin/documentFormList.js}"></script>
    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
    <link rel="stylesheet" th:href="@{/css/bootcss/bootstrap2.css}">
    <link rel="stylesheet" th:href="@{/css/admin/adminSidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin/adminHeader.css}">
    <link rel="stylesheet" th:href="@{/css/admin/documentFormList.css}">
    <link rel="stylesheet" th:href="@{/css/admin/documentModal.css}">
</head>
<body>
<div class="admin-wrap">
    <th:block th:replace="~{fragments/admin-side :: side}"></th:block>

    <div class="admin-main-content">
        <th:block th:replace="~{fragments/admin-header :: header}"></th:block>

        <div class="table-wrap">
            <div class="right-align">
                <span class="menu-name">관리자 &gt; 문서 관리 &gt; 문서 양식 리스트</span>
            </div>
            <!--/* 삭제만 submit 추가는 새 페이지 */-->
            <form th:action="@{/admin/document/form-delete-proc}" method="post" name="docFrm">
                <div class="table-header-container">
                    <div class="button-group">
                        <button type="submit" class="btn btn-danger" name="flag"
                                value="delete">삭제</button>
                        <button type="button" class="btn btn-primary" id="btn-register">추가</button>
                    </div>
                </div>
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th><input type="checkbox" id="chkAll"></th>
                        <th scope="col" style="width: 20%">문서 번호</th>
                        <th scope="col" style="width: 30%">문서 제목</th>
                        <th scope="col" style="width: 50%">내용 보기</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="template : ${templates}">
                        <td><input type="checkbox" name="templateId" th:value="${template.id}"></td>
                        <td><a th:href="@{/admin/document/form-register(flag='update',id=${template.id})}"
                               th:text="${template.id}">1</a></td>
                        <td th:text="${template.subject}">문서 제목</td>
                        <td>
                            <button type="button" class="btn btn-primary"
                                    data-bs-toggle="modal" data-bs-target="#calendar-plus">보기</button>
                            <div class="modal fade" id="calendar-plus"
                                 data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
                                 aria-labelledby="calendar-plus-label" aria-hidden="true">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <span class="close-button">×</span>
                                        <div class="document-content" th:utext="${template.content}"></div>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr>
                        <td colspan="3"></td>
                        <td></td>
                    </tr>
                    </tfoot>
                </table>
            </form>
        </div>
    </div>
</div>
</body>
</html>
