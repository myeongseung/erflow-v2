<!DOCTYPE html>
<!--/*
  문서 양식 리스트.
  출처: legacy/ERFlow/src/main/webapp/admin/document/documentFormList.jsp

  «보기» 는 모달을 연다. 모달은 줄마다 하나씩 그려지므로 **id 가 줄마다 달라야
  한다** — 레거시는 셋 다 `calendar-plus` 였고 그래서 어느 줄을 눌러도 첫 줄이
  떴다(D-066). 양식 번호를 붙여 갈랐다(D-121).
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: page('문서 양식 리스트', ${ {'/js/vendor/jquery-3.7.1.min.js', '/js/bootjs/bootstrap.bundle.js', '/js/admin/admin.js', '/js/admin/documentFormList.js'} })}">
</head>
<body>
<th:block th:replace="~{fragments/header :: header(${headerMenu}, ${currentUser})}"></th:block>

<div class="content-wrap">
    <th:block th:replace="~{fragments/admin-side :: side}"></th:block>

    <div class="admin-main-content">
        <div class="table-wrap">
            <div th:replace="~{fragments/page-head :: head(|관리자 &gt; 문서 관리 &gt; 문서 양식 리스트|)}"></div>
            <!--/* 삭제만 submit 추가는 새 페이지 */-->
            <form th:action="@{/admin/document/form-delete-proc}" method="post" name="docFrm">
                <div class="table-header-container">
                    <div class="button-group">
                        <button type="submit" class="btn btn-danger" name="flag"
                                value="delete">삭제</button>
                        <button type="button" class="btn btn-primary" id="btn-register">추가</button>
                    </div>
                </div>
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th><input type="checkbox" id="chkAll"></th>
                        <th scope="col" style="width: 20%">문서 번호</th>
                        <th scope="col" style="width: 30%">문서 제목</th>
                        <th scope="col" style="width: 50%">내용 보기</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="template : ${templates}">
                        <td><input type="checkbox" name="templateId" th:value="${template.id}"></td>
                        <td><a th:href="@{/admin/document/form-register(flag='update',id=${template.id})}"
                               th:text="${template.id}">1</a></td>
                        <td th:text="${template.subject}">문서 제목</td>
                        <td>
                            <!--/*
                              id 는 줄마다 달라야 한다.

                              레거시는 이 자리를 메인 화면의 일정 등록 모달에서
                              복사해 왔고 이름까지 그대로 `calendar-plus` 였다.
                              그런데 이 모달은 th:each 안에 있어 **양식 수만큼
                              그려진다** — 셋이 같은 id 를 갖고 버튼도 전부 그
                              id 를 가리켰다. 브라우저는 중복 id 에서 첫 번째를
                              집으므로 **어느 줄의 «보기»를 눌러도 첫 줄 양식이
                              떴다**(D-066). 양식 번호를 붙여 가른다(D-121).
                            */-->
                            <button type="button" class="btn btn-primary" data-bs-toggle="modal"
                                    th:data-bs-target="'#template-preview-' + ${template.id}">보기</button>
                            <div class="modal fade" th:id="'template-preview-' + ${template.id}"
                                 data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
                                 th:aria-label="${template.subject}" aria-hidden="true">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <span class="close-button">×</span>
                                        <!--/* 양식 미리보기. 거른 HTML 이다(D-118, O-010).
                                               편집 화면은 원본을 받는다 — 거른 값을 편집기에
                                               넣으면 저장할 때마다 서식이 깎인다. */-->
                                        <div class="document-content" th:utext="${template.contentSafe}"></div>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr>
                        <td colspan="3"></td>
                        <td></td>
                    </tr>
                    </tfoot>
                </table>
            </form>
        </div>
    </div>
</div>
</body>
</html>
