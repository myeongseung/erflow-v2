<!DOCTYPE html>
<!--/*
  문서 양식 — 목록(D-155).
  출처: legacy/ERFlow/src/main/webapp/admin/document/documentFormList.jsp

  목록 틀(D-148)의 카드 하나. 양식 이름을 누르면 수정 화면으로, «보기» 는 그 줄의
  미리보기 대화상자를 연다. 대화상자는 줄마다 하나씩 그리므로 id 가 양식 번호로
  갈린다(D-121). 추가·수정은 편집기가 넓어야 해서 대화상자가 아니라 화면이다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: page('문서 양식', ${ {'/js/vendor/jquery-3.7.1.min.js', '/js/admin/admin.js', '/js/common/table.js', '/js/common/dialog.js'} })}">
</head>
<body th:insert="~{fragments/admin-shell :: shell('관리자 &gt; 문서 관리 &gt; 문서 양식', |양식 ${#lists.size(templates)}|, ~{::content})}">
<th:block th:fragment="content">
    <section class="list-card">
        <div class="toolbar">
            <div class="toolbar-actions">
                <h2 class="card-title">문서 양식</h2>
                <span class="count-badge" th:text="${#lists.size(templates)}">3</span>
                <a class="btn btn-primary" th:href="@{/admin/document/form-register}">양식 추가</a>
                <button type="submit" class="btn btn-danger" form="docFrm">삭제</button>
            </div>
        </div>
        <form id="docFrm" th:action="@{/admin/document/form-delete-proc}" method="post"
              onsubmit="return confirm('선택한 양식을 지울까요?');"></form>
        <div class="table-scroll">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th class="check-col"><input type="checkbox" data-check-all="templateId" aria-label="양식 전체 선택"></th>
                    <th scope="col">양식 이름</th>
                    <th scope="col">미리보기</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(templates)}">
                    <td colspan="3" class="empty-cell">양식이 없습니다.</td>
                </tr>
                <tr th:each="template : ${templates}">
                    <td class="check-col"><input type="checkbox" name="templateId" form="docFrm" th:value="${template.id}"></td>
                    <td><a class="row-link" th:href="@{/admin/document/form-register(flag='update',id=${template.id})}"
                           th:text="${template.subject}">양식 이름</a></td>
                    <td><button type="button" class="link-btn"
                                th:data-dialog-open="'template-preview-' + ${template.id}">보기</button></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <!--/* 양식 미리보기 — 거른 HTML 이다(D-118). 편집 화면은 원본을 받는다. */-->
    <dialog th:each="template : ${templates}" class="dialog is-wide"
            th:id="'template-preview-' + ${template.id}" th:aria-label="${template.subject}">
        <div class="dialog-head">
            <h2 class="dialog-title" th:text="${template.subject}">양식 이름</h2>
            <button type="button" class="dialog-close" data-dialog-close aria-label="닫기">
                <i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="dialog-body">
            <div class="document-content" th:utext="${template.contentSafe}"></div>
        </div>
    </dialog>
</th:block>
</body>
</html>
