<!DOCTYPE html>
<!--/*
  문서 리스트 (D-160).
  출처: legacy/ERFlow/src/main/webapp/document/documentList.jsp

  목록 틀(D-148)의 카드 하나. 내 문서만 보인다 — 조회가 사번으로 좁혀져 있다.
  제목을 누르면 기안 수정으로, «기안 작성» 은 쓰기 화면으로 간다. 결재에 올린 적이
  없는 문서에는 «결재 올리기» 가 붙는다 — 결재 올리기 화면이 그 문서를 미리 고른 채
  열린다. 결재 상태는 알약(메인·관리자 홈과 같은 색).
  삭제는 체크한 줄을 빈 폼(documentFrm)에 실어 보낸다 — 결재 진행 중인 문서는 서버가
  건너뛴다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: page('문서 리스트', ${ {'/js/common/table.js'} })}">
</head>
<body th:insert="~{fragments/user-shell :: shell('사용자 &gt; 문서 관리 &gt; 문서 리스트', |문서 ${page.totalRecord}|, ~{::content})}">
<th:block th:fragment="content">
    <section class="list-card">
        <div class="toolbar">
            <div class="toolbar-actions">
                <a class="btn btn-primary" th:href="@{/document/register}">기안 작성</a>
                <button type="submit" class="btn btn-danger" form="documentFrm">삭제</button>
            </div>
            <form class="toolbar-search" th:action="@{/document/list}" method="get">
                <select name="keyfield" aria-label="검색할 칸">
                    <option value="" th:selected="${keyfield == ''}">전체 조회</option>
                    <option value="id" th:selected="${keyfield == 'id'}">문서번호</option>
                    <option value="subject" th:selected="${keyfield == 'subject'}">제목</option>
                    <option value="template" th:selected="${keyfield == 'template'}">양식</option>
                </select>
                <div class="main-search-container">
                    <div class="main-search-border">
                        <input class="main-search-text" type="search" name="keyword"
                               placeholder="문서 검색" aria-label="문서 검색어" th:value="${keyword}">
                    </div>
                    <div class="main-search-icon">
                        <i class="fa-solid fa-magnifying-glass fa-lg" title="검색하기"></i>
                    </div>
                </div>
            </form>
        </div>
        <form id="documentFrm" th:action="@{/document/delete-proc}" method="post"
              onsubmit="return confirm('선택한 문서를 지울까요?\n결재 진행 중인 문서는 지워지지 않습니다.');"></form>
        <div class="table-scroll">
            <table class="table table-striped table-nowrap">
                <thead>
                <tr>
                    <th scope="col" class="check-col"><input type="checkbox" data-check-all="docId" aria-label="모두 선택"></th>
                    <th scope="col" class="num-col">번호</th>
                    <th scope="col">제목</th>
                    <th scope="col">양식</th>
                    <th scope="col">만든 시각</th>
                    <th scope="col">고친 시각</th>
                    <th scope="col">결재 상태</th>
                    <th scope="col"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(documents)}">
                    <td colspan="8" class="empty-cell">문서가 없습니다. «기안 작성» 으로 첫 문서를 만드세요.</td>
                </tr>
                <tr th:each="document : ${documents}">
                    <td class="check-col"><input type="checkbox" name="docId" form="documentFrm" th:value="${document.id}"></td>
                    <td class="num-col" th:text="${document.id}">1</td>
                    <td class="ellipsis-cell"><a class="row-link" th:href="@{/document/register(flag='update',docId=${document.id})}"
                           th:text="${document.subject}" th:title="${document.subject}">제목</a></td>
                    <td th:text="${document.templateLabel()}" th:classappend="${document.templateName == null} ? 'muted-cell'">양식</td>
                    <td th:text="${document.createdAt}">만든 시각</td>
                    <td th:text="${document.updatedLabel()}" th:classappend="${document.updatedAt == null} ? 'muted-cell'">고친 시각</td>
                    <td><span class="status-badge" th:classappend="${document.statusClass()}" th:text="${document.statusLabel()}">결재 전</span></td>
                    <td class="nowrap-cell"><a class="cell-action" th:if="${document.canPropose()}"
                           th:href="@{/proposal/register(documentId=${document.id})}">결재 올리기</a></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="page-controller" th:if="${page.totalPage > 1}">
            <a th:if="${page.hasPreviousBlock()}"
               th:href="@{/document/list(nowPage=${page.pagePerBlock * (page.nowBlock - 2) + 1},keyfield=${keyfield},keyword=${keyword})}">이전</a>
            <ul class="page-numbers">
                <li th:each="n : ${page.pageNumbers}">
                    <a th:href="@{/document/list(nowPage=${n},keyfield=${keyfield},keyword=${keyword})}"
                       th:classappend="${n == page.nowPage} ? 'disabled'" th:text="${n}">1</a>
                </li>
            </ul>
            <a th:if="${page.hasNextBlock()}"
               th:href="@{/document/list(nowPage=${page.pagePerBlock * page.nowBlock + 1},keyfield=${keyfield},keyword=${keyword})}">다음</a>
        </div>
    </section>
</th:block>
</body>
</html>
