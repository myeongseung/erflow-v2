<!DOCTYPE html>
<!--/*
  결재라인 관리 — 목록 (D-160).
  출처: legacy/ERFlow/src/main/webapp/proposal/proposalRouteList.jsp

  목록 틀(D-148)의 카드 하나. 내가 만든 결재라인만 보인다. 결재 경로는 사람마다
  «이름 직급» 알약으로 줄지어 보여 준다(fragments/route-chain). 이름을 누르면 고치기로,
  «결재라인 만들기» 는 만들기 화면으로 간다. 삭제는 체크한 줄을 빈 폼에 실어 보낸다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: page('결재라인 관리', ${ {'/js/common/table.js'} })}">
</head>
<body th:insert="~{fragments/user-shell :: shell('사용자 &gt; 전자결재 &gt; 결재라인 관리', |결재라인 ${page.totalRecord}|, ~{::content})}">
<th:block th:fragment="content">
    <section class="list-card">
        <div class="toolbar">
            <div class="toolbar-actions">
                <a class="btn btn-primary" th:href="@{/proposal/route-register}">결재라인 만들기</a>
                <button type="submit" class="btn btn-danger" form="routeFrm">삭제</button>
            </div>
            <form class="toolbar-search" th:action="@{/proposal/route-list}" method="get">
                <select name="keyfield" aria-label="검색할 칸">
                    <option value="" th:selected="${keyfield == ''}">전체 조회</option>
                    <option value="id" th:selected="${keyfield == 'id'}">번호</option>
                    <option value="route" th:selected="${keyfield == 'route'}">결재 경로(사번)</option>
                </select>
                <div class="main-search-container">
                    <div class="main-search-border">
                        <input class="main-search-text" type="search" name="keyword"
                               placeholder="결재라인 검색" aria-label="결재라인 검색어" th:value="${keyword}">
                    </div>
                    <div class="main-search-icon">
                        <i class="fa-solid fa-magnifying-glass fa-lg" title="검색하기"></i>
                    </div>
                </div>
            </form>
        </div>
        <form id="routeFrm" th:action="@{/proposal/route-delete-proc}" method="post"
              onsubmit="return confirm('선택한 결재라인을 지울까요?');"></form>
        <div class="table-scroll">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th scope="col" class="check-col"><input type="checkbox" data-check-all="proposalId" aria-label="모두 선택"></th>
                    <th scope="col" class="num-col">번호</th>
                    <th scope="col">이름</th>
                    <th scope="col">결재 경로</th>
                    <th scope="col">만든 시각</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(routes)}">
                    <td colspan="5" class="empty-cell">결재라인이 없습니다. «결재라인 만들기» 로 첫 결재라인을 만드세요.</td>
                </tr>
                <tr th:each="route : ${routes}">
                    <td class="check-col"><input type="checkbox" name="proposalId" form="routeFrm" th:value="${route.id}"></td>
                    <td class="num-col" th:text="${route.id}">1</td>
                    <td class="nowrap-cell"><a class="row-link" th:href="@{/proposal/route-update(id=${route.id})}"
                           th:text="${route.nickname}">이름</a></td>
                    <td class="chain-cell"><th:block th:replace="~{fragments/route-chain :: chain(${route.steps})}"></th:block></td>
                    <td class="nowrap-cell" th:text="${route.createdAt}">만든 시각</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="page-controller" th:if="${page.totalPage > 1}">
            <a th:if="${page.hasPreviousBlock()}"
               th:href="@{/proposal/route-list(nowPage=${page.pagePerBlock * (page.nowBlock - 2) + 1},keyfield=${keyfield},keyword=${keyword})}">이전</a>
            <ul class="page-numbers">
                <li th:each="n : ${page.pageNumbers}">
                    <a th:href="@{/proposal/route-list(nowPage=${n},keyfield=${keyfield},keyword=${keyword})}"
                       th:classappend="${n == page.nowPage} ? 'disabled'" th:text="${n}">1</a>
                </li>
            </ul>
            <a th:if="${page.hasNextBlock()}"
               th:href="@{/proposal/route-list(nowPage=${page.pagePerBlock * page.nowBlock + 1},keyfield=${keyfield},keyword=${keyword})}">다음</a>
        </div>
    </section>
</th:block>
</body>
</html>
