<!DOCTYPE html>
<!--/*
  결재라인 관리 — 목록.
  출처: legacy/ERFlow/src/main/webapp/proposal/proposalRouteList.jsp

  내가 만든 결재라인만 보인다. 결재경로(사번을 ; 로 이은 문자열)를 사람마다 풀어
  «[부서/직급] 이름(사번) -> ...» 로 보여준다. 등록·수정·삭제는 다음 단계에서 붙인다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('결재 라인 관리', ${ {'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css', '/css/bootcss/bootstrap.css', '/css/common/common.css', '/css/common/page.css', '/css/main/header.css', '/css/main/aside.css', '/css/proposal/proposalList.css'} }, ${ {'https://code.jquery.com/jquery-latest.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.9.2/umd/popper.min.js', '/js/bootjs/bootstrap.js', '/js/admin/admin.js', '/js/proposal/proposalRoute.js'} })}">
</head>
<body>
<th:block th:replace="~{fragments/header :: header(${headerMenu}, ${currentUser})}"></th:block>

<div class="content-wrap">
    <th:block th:replace="~{fragments/side-menu :: side(${sideMenu})}"></th:block>

    <div class="table-wrap">
        <div class="right-align">
            <span class="menu-name">사용자 &gt; 전자결재 &gt; 결재라인 관리</span>
        </div>

        <form th:action="@{/proposal/route-delete-proc}" method="post" name="proposalFrm">
            <div class="table-header-container">
                <div class="button-group">
                    <button type="button" class="btn btn-danger" id="delete-button"
                            name="flag" value="delete">삭제</button>
                    <button type="button" class="btn btn-primary" id="register-button">생성</button>
                </div>
                <div class="search-option">
                    <select name="keyfield" id="">
                        <option value="" th:selected="${keyfield == ''}">전체조회</option>
                        <option value="id" th:selected="${keyfield == 'id'}">문서번호</option>
                        <option value="route" th:selected="${keyfield == 'route'}">결재경로</option>
                    </select>
                    <div class="main-search-container">
                        <div class="main-search-border">
                            <input class="main-search-text" type="search" placeholder="결재 검색"
                                   aria-label="Search" name="keyword" th:value="${keyword}">
                        </div>
                        <div class="main-search-icon">
                            <i class="fa-solid fa-magnifying-glass fa-lg" title="검색하기"></i>
                        </div>
                    </div>
                </div>
            </div>

            <table class="table table-striped">
                <thead>
                <tr>
                    <th scope="col" style="width: 5%"><input type="checkbox" id="chkAll"></th>
                    <th scope="col" style="width: 8%">결재관리번호</th>
                    <th scope="col" style="width: 8%">결재라인명</th>
                    <th scope="col">결재경로</th>
                    <th scope="col" style="width: 12%">생성 시간</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="route : ${routes}">
                    <th scope="col" class="proposal-id">
                        <input type="checkbox" name="proposalId" th:value="${route.id}">
                    </th>
                    <td><a th:href="@{/proposal/route-update(id=${route.id})}" th:text="${route.id}">1</a></td>
                    <td th:text="${route.nickname}">결재라인명</td>
                    <td th:text="${route.routeChain}">결재경로</td>
                    <td th:text="${route.createdAt}">생성 시간</td>
                </tr>
                </tbody>
                <tfoot>
                <td colspan="4"></td>
                <td></td>
                </tfoot>
            </table>
        </form>

        <form name="readFrm" th:action="@{/proposal/route-list}" method="get">
            <input type="hidden" name="nowPage" th:value="${page.nowPage}">
            <input type="hidden" name="keyfield" th:value="${keyfield}">
            <input type="hidden" name="keyword" th:value="${keyword}">
        </form>

        <!--/* 페이징 (proposalRoute.js 의 block/paging 이 readFrm 을 제출한다) */-->
        <div class="page-controller">
            <a th:if="${page.hasPreviousBlock()}" class="disabled"
               th:href="|javascript:block(5, ${page.nowBlock - 1})|">이전</a>
            <ul class="page-numbers">
                <a th:each="number : ${page.pageNumbers}"
                   th:href="|javascript:paging(${number})|"
                   th:classappend="${number == page.nowPage} ? 'disabled'">
                    <li th:text="${number}">1</li>
                </a>
            </ul>
            <a th:if="${page.hasNextBlock()}"
               th:href="|javascript:block(5, ${page.nowBlock + 1})|">다음</a>
        </div>
    </div>
</div>
</body>
</html>
