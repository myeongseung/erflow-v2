<!DOCTYPE html>
<!--/*
  결재라인 수정.
  출처: legacy/ERFlow/src/main/webapp/proposal/proposalRouteUpdate.jsp

  기존 결재자들을 표로 보여준다. 순서를 바꾸거나(sortable) 빼고 결재명을 고쳐 제출한다.
  등록과 달리 사용자 찾기가 없고, 만든 사람을 앞에 다시 넣지 않는다 — 표의 순서를
  그대로 저장한다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: page('결재라인 수정 페이지', ${ {'/js/vendor/jquery-3.7.1.min.js', '/js/vendor/jquery-ui-1.13.3.min.js', '/js/bootjs/bootstrap.bundle.js', '/js/main/index.js', '/js/proposal/proposalRegister.js'} })}">
</head>
<body>
<th:block th:replace="~{fragments/header :: header(${headerMenu}, ${currentUser})}"></th:block>

<div class="content-wrap">
    <th:block th:replace="~{fragments/side-menu :: side(${sideMenu})}"></th:block>

    <div class="proposal-insert-wrap">
        <div th:replace="~{fragments/page-head :: head(|사용자 &gt; 전자결재 &gt; 결재라인 수정 페이지|)}"></div>
        <div class="proposal-insert">
            <div class="proposal-form">
                <form th:action="@{/proposal/route-update-proc}" method="post" name="proposalFrm">
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text" id="basic-addon1">결재경로 ID:</span>
                        </div>
                        <input type="text" class="form-control" id="proposalId" placeholder="결재경로 ID"
                               aria-label="proposalId" aria-describedby="basic-addon1"
                               name="proposalId" th:value="${proposalId}">
                    </div>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text" id="basic-addon1">결재명:</span>
                        </div>
                        <input type="text" class="form-control" id="proposalName" placeholder="결재명"
                               aria-label="nickname" aria-describedby="basic-addon1"
                               name="nickname" th:value="${nickname}">
                    </div>
                    <div class="form-group d-grid gap-2">
                        <table id="myTable" class="table table-striped">
                            <tr>
                                <td>No</td>
                                <td>이름</td>
                                <td>사번</td>
                                <td>직급</td>
                            </tr>
                            <tr th:each="u,stat : ${routeUsers}">
                                <td th:text="${stat.count}">1</td>
                                <td th:text="${u.name}">이름</td>
                                <td>
                                    <span th:text="${u.id}">사번</span>
                                    <input type="hidden" name="routeId" th:value="${u.id}">
                                </td>
                                <td th:text="${u.jobName}">직급</td>
                            </tr>
                        </table>
                    </div>
                    <div class="form-group text-center">
                        <button type="submit" class="form-Register-btn">제출</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
