<!DOCTYPE html>
<!--/*
  결재 문서 보기 (D-160).
  출처: legacy/ERFlow/src/main/webapp/proposal/proposalDocument.jsp

  왼쪽이 문서 한 장(제목 · 결재선 도장 표 · 본문), 오른쪽이 결재 의견 카드와 승인·반려.
  도장 표는 결재선 자리마다 한 칸이다. 이름과 날짜는 승인된 자리에만 찍히고, 결재 행이
  아직 없는 자리는 빈 칸으로 폭만 잡는다.
  본문은 저장된 HTML 이다. 표와 서식이 인라인 style 에 있어 이스케이프도 style 제거도
  할 수 없다 — 허용목록으로 거른다(D-118, O-010).
  승인·반려는 내 차례일 때만 나온다. 반려는 사유가 있어야 보내진다(js/proposal/document.js).
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: page('결재 문서 보기', ${ {'/js/proposal/document.js'} })}">
</head>
<body th:insert="~{fragments/user-shell :: shell('사용자 &gt; 전자결재 &gt; 결재 문서 보기', null, ~{::content})}">
<th:block th:fragment="content">
    <div class="approval-layout">
        <article class="approval-paper">
            <div class="approval-header">
                <div class="approval-title">
                    <span class="approval-title-span" th:text="${document.subject}">문서제목</span>
                </div>
                <div class="approval-wrap">
                    <table class="approval-table">
                        <tr>
                            <th rowspan="4">결<br>재<br>라<br>인</th>
                            <td>담당</td>
                            <td th:each="cell : ${document.reviewCells}">검토</td>
                            <td>승인</td>
                        </tr>
                        <tr>
                            <th:block th:each="stamp : ${document.stamps}">
                                <td th:if="${stamp.filled}" rowspan="2" class="proposal-stamp" th:text="${stamp.name}">결재자</td>
                                <td th:unless="${stamp.filled}" rowspan="2">&nbsp;&nbsp;</td>
                            </th:block>
                        </tr>
                        <tr></tr>
                        <tr>
                            <th:block th:each="stamp : ${document.stamps}">
                                <td th:if="${stamp.filled}" th:text="${stamp.approvedAt}">01/01</td>
                                <td th:unless="${stamp.filled}">&nbsp;&nbsp;</td>
                            </th:block>
                        </tr>
                    </table>
                </div>
            </div>
            <hr>
            <div class="approval-content" th:utext="${document.contentSafe}"></div>
        </article>

        <aside class="approval-side">
            <section class="list-card">
                <div class="toolbar">
                    <h2 class="card-title">결재 의견</h2>
                    <span class="count-badge" th:text="${#lists.size(document.comments)}">0</span>
                </div>
                <ul class="opinion-list" th:unless="${#lists.isEmpty(document.comments)}">
                    <li th:each="comment : ${document.comments}">
                        <b th:text="${comment.userName}">결재자</b>
                        <p th:text="${comment.comment}">의견</p>
                    </li>
                </ul>
                <p class="empty-note" th:if="${#lists.isEmpty(document.comments)}">아직 남긴 의견이 없습니다.</p>
            </section>

            <form class="decision-form" th:action="@{/proposal/document-proc}" method="post"
                  th:if="${document.editable}" id="decisionFrm">
                <input type="hidden" name="proposalId" th:value="${document.id}">
                <input type="hidden" name="step" th:value="${document.step}">
                <input type="hidden" name="result" value="">
                <div class="form-group">
                    <label for="comment">내 의견</label>
                    <textarea id="comment" name="comment" rows="4" placeholder="승인할 때는 비워도 됩니다. 반려할 때는 사유를 적어 주세요."></textarea>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn btn-primary" data-decide="confirm">승인</button>
                    <button type="button" class="btn btn-danger" data-decide="reject" th:if="${document.step != 0}">반려</button>
                </div>
            </form>
            <p class="empty-note is-boxed" th:unless="${document.editable}">지금은 내 차례가 아니거나 결재가 끝난 문서입니다.</p>

            <a class="btn back-link" th:href="@{/proposal/list}">결재 리스트로</a>
        </aside>
    </div>
</th:block>
</body>
</html>
