<!--/*
  공통 <head>.

  ## 스타일시트는 이제 하나다 (D-119)

  전에는 **화면마다 CSS 목록과 순서가 달랐다.** 레거시가 화면마다 손으로 적었고 56가지
  조합이 있었다 — 같은 파일을 두 번 싣는 화면도, `bootstrap2.css` 라는 다른 파일을 쓰는
  화면도 있었다. 나중에 실은 것이 이기므로 순서가 곧 화면이었고, 그래서 이 조각은 화면이
  넘기는 목록을 그대로 받았다(D-093).

  재설계는 그 장치를 없앤다. 디자인이 하나면 화면마다 다른 목록은 순수한 부채다.
  `app.css` 하나만 싣는다 — Tailwind 가 화면과 JS 를 훑어 만든 것이고, 2.2MB 였던
  Bootstrap 더미가 20KB 로 줄었다.

  ## 조각이 하나뿐인 이유

  한때 «구식 3인수 호출을 위한 다리» 를 이 파일에 같이 두려 했다. **작동하지
  않는다** — Thymeleaf 의 조각 선택자 `:: head(...)` 는 `th:fragment` 이름뿐 아니라
  **요소 이름으로도 매칭**한다. 파일에 `<head>` 가 둘이 되는 순간 앞의 것이 잡히고
  «2개를 선언했는데 3개가 왔다» 로 터진다. 그래서 이 파일에 `<head>` 는 하나다.

  ## 스크립트는 아직 화면마다 다르다

  고정으로 싣던 다섯 개 때문에 화면이 필요로 하는 것이 빠진 적이 있다 — 우편번호
  찾기(postcode)·날짜 고르기(jquery-ui)·편집기(ckeditor)가 없어 버튼을 눌러도 아무
  일이 없었다(D-096). 그래서 목록은 화면이 갖는다. 라이브러리 교체가 끝나면 이쪽도
  줄어든다.

  `csrf.js` 만 우리가 넣는다. 레거시에 없던 것이고 ajax 에 토큰을 붙이는 데 필요하다
  (D-086). jQuery 뒤에 와야 하므로 목록 다음에 붙인다.
*/-->
<head th:fragment="page(title, scripts)" xmlns:th="http://www.thymeleaf.org">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--/*
      JSON 을 보내는 ajax 가 실어 보낼 CSRF 토큰. form 은 Thymeleaf 가 알아서
      hidden 입력을 넣지만 ajax 는 form 이 아니다(D-086).
    */-->
    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="_csrf_header" th:content="${_csrf?.headerName}">
    <title th:text="${title}">ERFlow</title>

    <!--/*
      글꼴을 미리 받아 둔다. 자체 호스팅이라 다른 서버를 기다리지 않는다 —
      전에는 남의 CDN 넷에 매달려 있었고 그중 둘은 URL 이 깨져 있었다(D-119).
    */-->
    <link rel="preload" href="/fonts/PretendardVariable.woff2" as="font"
          type="font/woff2" crossorigin>
    <link rel="stylesheet" th:href="@{/css/app.css}">

    <script th:each="js : ${scripts}" th:src="@{${js}}"></script>
    <script th:src="@{/js/common/csrf.js}"></script>
</head>
