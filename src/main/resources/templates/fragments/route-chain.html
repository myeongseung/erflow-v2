<!--/*
  결재 경로 알약 줄 (D-160). 결재라인 목록 · 결재라인 고르기 대화상자 · 결재 올리기의
  미리보기가 같은 모양을 쓴다.
      <th:block th:replace="~{fragments/route-chain :: chain(${route.steps})}"></th:block>
  사람마다 «이름 직급» 알약 하나, 사이에 화살표. 모르는 사번(사라진 사용자)은 사번만.
*/-->
<th:block th:fragment="chain(steps)" xmlns:th="http://www.thymeleaf.org">
<span class="route-chain">
    <th:block th:each="step, stat : ${steps}">
        <span class="route-step" th:title="${step.deptName}">
            <b th:text="${#strings.isEmpty(step.name)} ? ${step.id} : ${step.name}">이름</b>
            <small th:unless="${#strings.isEmpty(step.jobName)}" th:text="${step.jobName}">직급</small>
        </span>
        <i class="route-arrow" th:unless="${stat.last}" aria-hidden="true"></i>
    </th:block>
</span>
</th:block>
