<!--/*
  사용자 사이드 메뉴 — 항목은 menu 테이블에서 온다.

  펼침 전용 그룹은 글자만, 링크가 있으면 감싼다(최상위인데 바로 이동하는 «게시판»).
  현재 항목은 currentMenuUrl(LayoutModelAdvice)과 주소가 같은 것이다(D-159) —
  그 구역의 하위 화면(글 보기, 글쓰기)도 같은 항목에 속한다.
*/-->
<section class="app" th:fragment="side(menu)">
    <aside class="sidebar">
        <nav class="sidebar-nav">
            <ul class="sidebar-ul">
                <li class="sidebar-mainmenu" th:each="item : ${menu}"
                    th:classappend="${!item.group and item.url == currentMenuUrl} ? 'is-current'">
                    <span class="menu-title" th:if="${item.group}" th:text="${item.label}">그룹</span>
                    <a th:unless="${item.group}" th:href="@{${item.url}}">
                        <span class="menu-title" th:text="${item.label}">메뉴</span>
                    </a>
                    <ul class="nav-flyout" th:if="${!item.children.isEmpty()}">
                        <li th:each="child : ${item.children}"
                            th:classappend="${child.url == currentMenuUrl} ? 'is-current'">
                            <a th:href="@{${child.url}}" th:text="${child.label}">하위 메뉴</a>
                        </li>
                    </ul>
                </li>
            </ul>
        </nav>
    </aside>
</section>
