<!--/*
  헤더.

  레거시 indexHeader.jsp 와 같은 구조다. 드롭다운 항목만 menu 테이블(placement=HEADER)
  에서 읽는다.

  드롭다운을 여는 항목은 로그인한 사람의 ID/이름이라 메뉴가 아니다. 레거시도
  <%=headerUserId%> <%=headerUserName%> 를 그대로 찍었다. 메뉴 테이블에 넣지 않고
  여기서 사용자 정보로 렌더링한다.

  알림 벨은 레거시에서도 href="#" 이고 글자도 기능도 없다. 메뉴가 아니라 레이아웃
  chrome 이므로 마크업에 그대로 둔다.
*/-->
<th:block th:fragment="header(menu, user)">
    <header>
        <nav class="navbar navbar-expand-lg bg-light">
            <div class="container-fluid">
                <!--/* 레거시: /ERFlow/index.jsp. index 화면은 아직 이관 전이라 발판으로 간다 */-->
                <a class="navbar-brand" th:href="@{/index}">
                    <img th:src="@{/images/common/logo.png}" title="ERFlow">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent"
                        aria-controls="navbarSupportedContent" aria-expanded="false"
                        aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="empty-place"></div>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0"></ul>

                    <ul class="nav nav-pills">
                        <li class="nav-item dropdown">
                            <!--/*
                              여는 태그 뒤 공백 하나까지 레거시 그대로다. 줄 첫머리
                              공백이라 브라우저가 접어 그림에는 차이가 없지만,
                              원문을 견주는 눈에는 차이로 보인다 — 맞춰 둔다.
                            */-->
                            <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown"
                               href="#" role="button" aria-expanded="false"> [[${user}]]</a>

                            <ul class="dropdown-menu">
                                <th:block th:each="item : ${menu}">
                                    <hr th:if="${item.separatorBefore}">
                                    <!--/* <i> 와 <span> 사이 줄바꿈은 공백으로 그려진다. 레거시는 붙여 쓴다. */-->
                                    <a class="dropdown-item" th:href="@{${item.url}}">
                                        <i th:if="${item.icon}" th:class="${item.icon}"></i><span th:text="${item.label}">항목</span></a>
                                </th:block>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                <i class="fa-regular fa-bell fa-lg"></i></a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!--/* 구분 선 */-->
    <div class="section2"></div>
</th:block>
