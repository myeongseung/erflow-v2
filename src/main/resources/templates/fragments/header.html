<!--/*
  상단 바. **사용자 화면과 관리자 화면이 이것 하나를 쓴다.**

  전에는 둘이었다(indexHeader.jsp / adminHeader.jsp). 마크업도 클래스도 달라서
  같은 앱인데 위쪽이 화면마다 다르게 생겼고, 고칠 때마다 두 번 고쳐야 했다.
  합칠 수 있었던 이유는 LayoutModelAdvice 가 `headerMenu`·`currentUser` 를
  **모든 화면에** 넣어 주기 때문이다 — 관리자 화면도 이미 갖고 있었다(D-119).

  자리도 맞췄다. 상단 바가 화면 맨 위를 가로지르고, 그 아래에 사이드바와 본문이
  나란히 온다. 관리자 화면은 사이드바가 세로로 다 차지하고 헤더가 오른쪽 칸
  안에 들어가는 구조였다 — 같은 앱에서 두 구조를 쓸 이유가 없다.

  드롭다운을 여는 항목은 로그인한 사람의 ID/이름이라 메뉴가 아니다. 레거시도
  <%=headerUserId%> <%=headerUserName%> 를 그대로 찍었다.

  알림 벨은 레거시에서도 href="#" 이고 글자도 기능도 없다. 메뉴가 아니라 레이아웃
  chrome 이므로 마크업에 그대로 둔다.
*/-->
<th:block th:fragment="header(menu, user)" xmlns:th="http://www.thymeleaf.org">
    <header class="app-header">
        <a class="navbar-brand" th:href="@{/index}">
            <img th:src="@{/images/common/logo.png}" alt="">
            <span class="brand-name">ERFlow</span>
        </a>

        <div class="empty-place"></div>

        <ul class="header-nav">
            <li class="header-item dropdown">
                <!--/*
                  여는 태그 뒤 공백 하나까지 레거시 그대로다. 줄 첫머리 공백이라
                  브라우저가 접어 그림에는 차이가 없지만, 원문을 견주는 눈에는
                  차이로 보인다 — 맞춰 둔다.
                */-->
                <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown"
                   href="#" role="button" aria-expanded="false"> [[${user}]]</a>

                <ul class="dropdown-menu dropdown-menu-end">
                    <th:block th:each="item : ${menu}">
                        <hr th:if="${item.separatorBefore}">
                        <!--/* <i> 와 <span> 사이 줄바꿈은 공백으로 그려진다. 레거시는 붙여 쓴다. */-->
                        <a class="dropdown-item" th:href="@{${item.url}}">
                            <i th:if="${item.icon}" th:class="${item.icon}"></i><span th:text="${item.label}">항목</span></a>
                    </th:block>
                </ul>
            </li>
            <li class="header-item">
                <a class="nav-link" href="#" aria-label="알림">
                    <i class="fa-regular fa-bell fa-lg"></i></a>
            </li>
        </ul>
    </header>
</th:block>
