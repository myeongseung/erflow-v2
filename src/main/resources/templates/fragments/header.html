<!--/*
  상단 바. 사용자 화면과 관리자 화면이 이것 하나를 쓴다(D-119).

  상단 바가 화면 맨 위를 가로지르고, 그 아래에 사이드바와 본문이 나란히 온다.
  LayoutModelAdvice 가 headerMenu·currentUser·me·unreadMessages 를 모든 화면에
  넣어 주므로 화면 컨트롤러는 이 조각을 모른다.

  드롭다운을 여는 항목은 로그인한 사람(머리글자 단추 + 이름)이다. 종에는 안 읽은
  쪽지 수가 배지로 붙고, 누르면 쪽지함으로 간다(D-150).
*/-->
<th:block th:fragment="header(menu, user)" xmlns:th="http://www.thymeleaf.org">
    <header class="app-header">
        <a class="navbar-brand" th:href="@{/index}">
            <img th:src="@{/images/common/logo.png}" alt="">
            <span class="brand-name">ERFlow</span>
        </a>

        <div class="empty-place"></div>

        <ul class="header-nav">
            <!--/* 종은 쪽지함으로 가는 길이라 쪽지 메뉴가 있는 사람에게만 보인다(D-135). */-->
            <li class="header-item" th:if="${!#lists.isEmpty(menu.?[url == '/message'])}">
                <a class="nav-link header-bell" th:href="@{/message}" aria-label="쪽지">
                    <i class="fa-regular fa-bell fa-lg"></i>
                    <span class="badge-count" th:if="${unreadMessages != null and unreadMessages > 0}"
                          th:text="${unreadMessages > 99 ? '99+' : unreadMessages}">3</span></a>
            </li>
            <li class="header-item dropdown">
                <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown"
                   href="#" role="button" aria-expanded="false">
                    <span class="avatar" th:if="${me != null}" th:text="${#strings.substring(me.name, 0, 1)}">홍</span>
                    <span class="header-user-name" th:text="${me != null} ? ${me.name} : ${user}">홍길동</span></a>

                <ul class="dropdown-menu dropdown-menu-end">
                    <th:block th:each="item : ${menu}">
                        <hr th:if="${item.separatorBefore}">
                        <a class="dropdown-item" th:href="@{${item.url}}">
                            <i th:if="${item.icon}" th:class="${item.icon}"></i><span th:text="${item.label}">항목</span></a>
                    </th:block>
                </ul>
            </li>
        </ul>
    </header>
</th:block>
