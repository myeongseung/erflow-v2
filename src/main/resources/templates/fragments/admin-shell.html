<!--/*
  관리자 화면의 껍데기 한 벌 (D-150).

  상단 바 · 사이드바 · 본문 상자 · 화면 머리를 여기서 한 번만 그린다. 관리자
  템플릿은 본문(content)만 들고 있다:

      <body th:insert="~{fragments/admin-shell :: shell('관리자 > 사원 관리', note, ~{::content})}">
          <th:block th:fragment="content"> ...본문... </th:block>
      </body>

  trail 은 길 표시이고 마지막 조각이 제목이 된다(fragments/page-head 와 같은 규칙).
  note 는 제목 옆의 짧은 글(개수 같은 것)이며 없으면 null.
  trail 이 null 이면 화면 머리 없이 본문을 바로 놓는다 — 관리자 홈이 그렇다.

  함정: 매개변수 이름은 화면의 모델 값 이름과 겹치면 안 된다. 본문 매개변수를 content
  라고 지었더니 문서 양식 화면의 ${content}(양식 본문)를 가려 편집기에 조각 마크업이
  들어갔다(D-155). 그래서 body 다.
*/-->
<th:block th:fragment="shell(trail, note, body)" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/header :: header(${headerMenu}, ${currentUser})}"></th:block>
<div class="content-wrap">
    <th:block th:replace="~{fragments/admin-side :: side}"></th:block>
    <div class="admin-main-content">
        <th:block th:if="${trail == null}">
            <th:block th:replace="${body}"></th:block>
        </th:block>
        <div class="admin-page" th:unless="${trail == null}"
             th:with="parts=${#strings.arraySplit(trail, '>')}">
            <div class="page-head">
                <div class="page-title-row">
                    <h1 class="page-title" th:text="${#strings.trim(parts[parts.length - 1])}">화면 이름</h1>
                    <span class="page-note" th:if="${note != null}" th:text="${note}">설명</span>
                </div>
                <nav class="menu-name" th:text="${trail}">관리자 &gt; 어디 &gt; 화면 이름</nav>
            </div>
            <th:block th:replace="${body}"></th:block>
        </div>
    </div>
</div>
</th:block>
