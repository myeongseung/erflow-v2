<!--/*
  사용자 화면의 껍데기 한 벌 (D-159). 관리자 껍데기(fragments/admin-shell)와 같은 규칙.

  상단 바 · 사이드바(DB 메뉴) · 본문 상자 · 화면 머리를 여기서 한 번만 그린다.
  화면 템플릿은 본문(body)만 들고 있다:

      <body th:insert="~{fragments/user-shell :: shell('사용자 > 게시판', note, ~{::content})}">
          <th:block th:fragment="content"> ...본문... </th:block>
      </body>

  trail 은 길 표시이고 마지막 조각이 제목이 된다. note 는 제목 옆 짧은 글, 없으면 null.
  trail 이 null 이면 화면 머리 없이 본문을 바로 놓는다.
  매개변수 이름은 화면의 모델 값과 겹치면 안 된다(D-155 함정) — 그래서 body 다.
*/-->
<th:block th:fragment="shell(trail, note, body)" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/header :: header(${headerMenu}, ${currentUser})}"></th:block>
<div class="content-wrap">
    <th:block th:replace="~{fragments/side-menu :: side(${sideMenu})}"></th:block>
    <div class="main-column">
        <th:block th:if="${trail == null}">
            <th:block th:replace="${body}"></th:block>
        </th:block>
        <div class="page" th:unless="${trail == null}"
             th:with="parts=${#strings.arraySplit(trail, '>')}">
            <div class="page-head">
                <div class="page-title-row">
                    <h1 class="page-title" th:text="${#strings.trim(parts[parts.length - 1])}">화면 이름</h1>
                    <span class="page-note" th:if="${note != null}" th:text="${note}">설명</span>
                </div>
                <nav class="menu-name" th:text="${trail}">사용자 &gt; 어디 &gt; 화면 이름</nav>
            </div>
            <th:block th:replace="${body}"></th:block>
        </div>
    </div>
</div>
</th:block>
