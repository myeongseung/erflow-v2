<!DOCTYPE html>
<!--/*
  답변 쓰기 (D-159).
  출처: legacy/ERFlow/src/main/webapp/post/postReply.jsp

  글쓰기와 같은 폼 카드인데 첨부가 없다 — 답변 처리가 파일을 받지 않는다.
  숨은 id 가 답할 글이다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: page('답변 쓰기', ${ {'/js/vendor/jquery-3.7.1.min.js', '/js/vendor/jodit-4.13.23.min.js', '/js/common/editor.js'} })}">
</head>
<body th:insert="~{fragments/user-shell :: shell('사용자 &gt; 게시판 &gt; ' + ${board.subject} + ' &gt; 답변 쓰기', null, ~{::content})}">
<th:block th:fragment="content">
    <form class="wide-form" method="post" th:action="@{/post/reply}">
        <input type="hidden" name="boardId" th:value="${boardId}">
        <input type="hidden" name="id" th:value="${postId}">
        <div class="form-group">
            <label for="subject">제목</label>
            <input type="text" id="subject" name="subject" placeholder="답변 제목" required autofocus>
        </div>
        <div class="form-group">
            <label for="editor1">본문</label>
            <textarea name="content" id="editor1" rows="10" cols="80"></textarea>
        </div>
        <div class="btn-group">
            <a class="btn" th:href="@{/post/view(boardId=${boardId}, id=${postId})}">취소</a>
            <button class="btn btn-primary" type="submit">답변 게시</button>
        </div>
    </form>
</th:block>
</body>
</html>
