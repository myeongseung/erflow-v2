<!DOCTYPE html>
<!--/*
  게시글 목록.
  출처: legacy/ERFlow/src/main/webapp/post/postList.jsp

  마크업 구조와 class 이름은 레거시 그대로다. css/post/postList.css 와
  js/post/postList.js 가 이 이름들에 걸려 있다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('게시글 목록', ${ {'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css', '/css/common/common.css', '/css/common/page.css', '/css/main/header.css', '/css/main/index.css', '/css/main/aside.css', '/css/bootcss/bootstrap.css', '/css/post/postList.css'} }, ${ {'https://code.jquery.com/jquery-latest.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.9.2/umd/popper.min.js', '/js/bootjs/bootstrap.js', '/js/main/index.js', '/js/post/postList.js'} })}">
</head>
<body>
<th:block th:replace="~{fragments/header :: header(${headerMenu}, ${currentUser})}"></th:block>

<div class="content-wrap">
    <th:block th:replace="~{fragments/side-menu :: side(${sideMenu})}"></th:block>

    <div class="main-notice">
        <div class="notice1">
            <div class="right-align">
                <!--/*
                  레거시는 «사용자 > 게시판 > <%=boardName%>» 한 덩어리다. 정적 부분만
                  따로 떼면 레거시에는 없던 정적 텍스트가 생긴 것으로 잡힌다 —
                  실제로 게이트가 그렇게 보고했다. 통짜 th:text 로 구조를 맞춘다.
                */-->
                <span class="menu-name"
                      th:text="'사용자 > 게시판 > ' + ${board.subject}">사용자 &gt; 게시판 &gt; </span>
            </div>

            <div class="box">
                <table class="table table-striped">
                    <form th:action="@{/post/register}">
                        <input type="hidden" name="boardId" th:value="${boardId}">
                        <tr>
                            <td class="table-name" colspan="4" th:text="${board.subject}">게시판</td>
                            <td id="postlist-th">
                                <button type="submit" value="write">글쓰기</button>
                            </td>
                        </tr>
                    </form>
                    <tr>
                        <th>글번호</th>
                        <th>제목</th>
                        <th>작성자</th>
                        <th>작성날짜</th>
                        <th>조회수</th>
                    </tr>

                    <tr th:each="row : ${posts}">
                        <td th:text="${row.displayNumber}">1</td>
                        <td align="left">
                            <!--/*
                              들여쓰기와 "답글 : " 은 레거시가 out.println 으로 찍는다.
                              pos 가 들여쓰기 깊이다(PostRow 설명 참조).
                              실데이터에 pos > 0 인 글이 없어 실화면으로는 검증되지 않는다.
                            */-->
                            <a class="post-reader" th:data-value="${row.post.id}" href="#">
                                <th:block th:each="i : ${#numbers.sequence(1, row.post.pos, 1)}"
                                          th:if="${row.post.pos > 0}">&nbsp;&nbsp;</th:block>
                                <th:block th:if="${row.post.reply()}">답글 : </th:block>
                                <span th:text="${row.post.subject}">제목</span></a>
                            <img th:if="${row.hasAttachment()}" th:src="@{/images/post/icon.gif}"
                                 alt="첨부파일" align="middle"/>
                            <span th:if="${row.hasComments()}">
                                <a class="comment-reader" href="#"
                                   th:text="'(' + ${row.commentCount} + ')'">(0)</a>
                            </span>
                        </td>
                        <td>
                            <a th:href="@{/profile(id=${row.post.userId})}"
                               style="text-decoration: none" th:text="${row.post.name}">작성자</a>
                        </td>
                        <!--/* 레거시는 rs.getString 결과를 그대로 찍는다. board-list.html 설명 참조. */-->
                        <td th:text="${#temporals.format(row.post.createdAt, 'yyyy-MM-dd HH:mm:ss')}">2023-01-01 00:00:00</td>
                        <td th:text="${row.post.count}">0</td>
                    </tr>

                    <tfoot>
                    <tr>
                        <td colspan="5"></td>
                    </tr>
                    </tfoot>
                </table>
            </div>

            <div class="userBoardList-footer">
                <form name="postFrm">
                    <div class="userBoardInfo">
                        <div>&nbsp;</div>
                        <div class="search-option">
                            <select name="keyfield">
                                <option value="" th:selected="${keyfield == ''}">전체조회</option>
                                <option value="subject" th:selected="${keyfield == 'subject'}">제목</option>
                                <option value="author" th:selected="${keyfield == 'author'}">작성자</option>
                            </select>

                            <div class="main-search-container">
                                <div class="main-search-border">
                                    <input class="main-search-text" type="search"
                                           placeholder="검색" aria-label="Search"
                                           name="keyword" th:value="${keyword}">
                                </div>
                                <div class="main-search-icon">
                                    <i class="fa-solid fa-magnifying-glass fa-lg" title="검색하기"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>

                <div class="page-controller">
                    <a th:if="${page.hasPreviousBlock()}" class="disabled"
                       th:href="|javascript:block('${page.pagePerBlock}', '${page.nowBlock - 1}')|">이전</a>
                    <ul class="page-numbers">
                        <a th:each="number : ${page.pageNumbers}"
                           th:href="|javascript:paging('${number}')|"
                           th:classappend="${number == page.nowPage} ? 'disabled'">
                            <li th:text="${number}">1</li>
                        </a>
                    </ul>
                    <a th:if="${page.hasNextBlock()}"
                       th:href="|javascript:block('${page.pagePerBlock}', '${page.nowBlock + 1}')|">다음</a>
                </div>
            </div>
        </div>
    </div>

    <!--/* js/post/postList.js 가 이 폼들을 읽어 검색·페이징·글 열기를 만든다. */-->
    <form name="searchFrm">
        <input type="hidden" name="keyfield" value="">
        <input type="hidden" name="keyword" value="">
    </form>
    <form name="readFrm">
        <input type="hidden" name="boardId" th:value="${boardId}">
        <input type="hidden" name="nowPage" th:value="${page.nowPage}">
        <input type="hidden" name="keyfield" th:value="${keyfield}">
        <input type="hidden" name="keyword" th:value="${keyword}">
    </form>
    <form th:action="@{/post/view}" name="showFrm">
        <input type="hidden" name="boardId" th:value="${boardId}">
        <input type="hidden" name="id">
    </form>
</div>
</body>
</html>
