<!DOCTYPE html>
<!--/*
  게시글 목록 (D-159).
  출처: legacy/ERFlow/src/main/webapp/post/postList.jsp

  목록 틀(D-148)의 카드 하나. 제목을 누르면 글 보기로, «글쓰기» 는 쓰기 화면으로
  간다. 검색과 쪽 번호는 보통의 GET 폼·링크이고 게시판 번호를 같이 싣는다.
  답글은 pos 만큼 들여쓰고 «답글 :» 을 앞에 붙인다(PostRow 설명 참조).
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: page(${board.subject}, ${ {'/js/common/table.js'} })}">
</head>
<body th:insert="~{fragments/user-shell :: shell('사용자 &gt; 게시판 &gt; ' + ${board.subject}, |글 ${page.totalRecord}|, ~{::content})}">
<th:block th:fragment="content">
    <section class="list-card">
        <div class="toolbar">
            <div class="toolbar-actions">
                <a class="btn btn-primary" th:href="@{/post/register(boardId=${boardId})}">글쓰기</a>
                <a class="btn" th:href="@{/post/board-list}">게시판 목록</a>
            </div>
            <form class="toolbar-search" th:action="@{/post/list}" method="get">
                <input type="hidden" name="boardId" th:value="${boardId}">
                <select name="keyfield" aria-label="검색할 칸">
                    <option value="" th:selected="${keyfield == ''}">전체 조회</option>
                    <option value="subject" th:selected="${keyfield == 'subject'}">제목</option>
                    <option value="author" th:selected="${keyfield == 'author'}">작성자</option>
                </select>
                <div class="main-search-container">
                    <div class="main-search-border">
                        <input class="main-search-text" type="search" name="keyword"
                               placeholder="글 검색" aria-label="글 검색어" th:value="${keyword}">
                    </div>
                    <div class="main-search-icon">
                        <i class="fa-solid fa-magnifying-glass fa-lg" title="검색하기"></i>
                    </div>
                </div>
            </form>
        </div>
        <div class="table-scroll">
            <table class="table table-striped table-nowrap">
                <thead>
                <tr>
                    <th scope="col" class="num-col">번호</th>
                    <th scope="col">제목</th>
                    <th scope="col">작성자</th>
                    <th scope="col">작성일</th>
                    <th scope="col">조회</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(posts)}">
                    <td colspan="5" class="empty-cell">글이 없습니다.</td>
                </tr>
                <tr th:each="row : ${posts}">
                    <td class="num-col" th:text="${row.displayNumber}">1</td>
                    <td class="subject-cell">
                        <span class="reply-indent" th:if="${row.post.pos > 0}"
                              th:style="'width:' + ${row.post.pos * 1.25} + 'rem'"></span>
                        <span class="reply-mark" th:if="${row.post.reply()}">답글</span>
                        <a class="row-link" th:href="@{/post/view(boardId=${boardId}, id=${row.post.id})}"
                           th:text="${row.post.subject}" th:title="${row.post.subject}">제목</a>
                        <span class="subject-extra" th:if="${row.hasAttachment()}" title="첨부 있음">
                            <img th:src="@{/images/post/icon.gif}" alt="첨부"></span>
                        <a class="comment-count" th:if="${row.hasComments()}"
                           th:href="@{/post/view(boardId=${boardId}, id=${row.post.id})}"
                           th:text="'[' + ${row.commentCount} + ']'">[0]</a>
                    </td>
                    <td><a th:href="@{/profile(id=${row.post.userId})}" th:text="${row.post.name}">작성자</a></td>
                    <td th:text="${#temporals.format(row.post.createdAt, 'yyyy-MM-dd HH:mm')}">작성일</td>
                    <td th:text="${row.post.count}">0</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="page-controller" th:if="${page.totalPage > 1}">
            <a th:if="${page.hasPreviousBlock()}"
               th:href="@{/post/list(boardId=${boardId},nowPage=${page.pagePerBlock * (page.nowBlock - 2) + 1},keyfield=${keyfield},keyword=${keyword})}">이전</a>
            <ul class="page-numbers">
                <li th:each="n : ${page.pageNumbers}">
                    <a th:href="@{/post/list(boardId=${boardId},nowPage=${n},keyfield=${keyfield},keyword=${keyword})}"
                       th:classappend="${n == page.nowPage} ? 'disabled'" th:text="${n}">1</a>
                </li>
            </ul>
            <a th:if="${page.hasNextBlock()}"
               th:href="@{/post/list(boardId=${boardId},nowPage=${page.pagePerBlock * page.nowBlock + 1},keyfield=${keyfield},keyword=${keyword})}">다음</a>
        </div>
    </section>
</th:block>
</body>
</html>
