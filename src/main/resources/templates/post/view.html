<!DOCTYPE html>
<!--/*
  게시글 보기 (D-159).
  출처: legacy/ERFlow/src/main/webapp/post/postView.jsp

  글 한 장(제목 · 쓴 사람과 시각 · 조회·댓글 수 · 동작 단추 · 첨부 · 본문)과 그 아래
  댓글 카드. 수정·삭제·답변은 POST 폼이고(D-031) 댓글 답글·수정은 접힌 폼을
  js/post/view.js 가 연다. 댓글 삭제도 POST 폼(commentDeleteFrm)이다.
  본문은 허용목록으로 거른 HTML 이다(D-118).
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: page(${post.subject}, ${ {'/js/post/view.js'} })}">
</head>
<body th:insert="~{fragments/user-shell :: shell('사용자 &gt; 게시판 &gt; ' + ${board.subject} + ' &gt; 글 보기', null, ~{::content})}">
<th:block th:fragment="content">
    <article class="post-article">
        <header class="post-head">
            <h2 class="post-title" th:text="${post.subject}">제목</h2>
            <div class="post-meta">
                <a class="post-author" th:href="@{/profile(id=${post.userId})}" th:text="${post.name}">작성자</a>
                <span class="meta-sep">·</span>
                <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">작성일</span>
                <span class="meta-sep">·</span>
                <span>조회 <b th:text="${post.count}">0</b></span>
                <span class="meta-sep">·</span>
                <span>댓글 <b th:text="${commentCount}">0</b></span>
                <div class="post-actions">
                    <form th:unless="${post.removed()}" th:action="@{/post/reply}" method="post">
                        <input type="hidden" name="boardId" th:value="${boardId}">
                        <input type="hidden" name="postId" th:value="${post.id}">
                        <button class="btn" type="submit">답변</button>
                    </form>
                    <form th:if="${mine}" th:action="@{/post/update}" method="post">
                        <input type="hidden" name="id" th:value="${post.id}">
                        <input type="hidden" name="boardId" th:value="${boardId}">
                        <button class="btn" type="submit">수정</button>
                    </form>
                    <form th:if="${admin or mine}" th:action="@{/post/delete}" method="post"
                          onsubmit="return confirm('이 글을 지울까요?');">
                        <input type="hidden" name="boardId" th:value="${boardId}">
                        <input type="hidden" name="postId" th:value="${post.id}">
                        <button class="btn btn-danger" type="submit">삭제</button>
                    </form>
                </div>
            </div>
            <ul class="post-files" th:if="${!post.removed() and !attachments.isEmpty()}">
                <li class="post-files-label">첨부</li>
                <li th:each="file : ${attachments}">
                    <a th:href="@{/post/download(file=${file.name})}" th:text="${file.displayName()}">파일명</a>
                </li>
            </ul>
        </header>
        <div class="content post-body" th:utext="${post.contentSafe}">본문</div>
    </article>
    <div class="post-nav">
        <a class="btn" th:href="@{/post/list(boardId=${boardId})}">목록</a>
    </div>

    <section class="list-card comment-card">
        <div class="toolbar">
            <div class="toolbar-actions">
                <h2 class="card-title">댓글</h2>
                <span class="count-badge" th:text="${commentCount}">0</span>
            </div>
        </div>
        <div class="comment-body">
            <th:block th:unless="${post.removed()}">
                <form class="comment-form" th:action="@{/post/comment/register}" method="post">
                    <input type="hidden" name="boardId" th:value="${boardId}">
                    <input type="hidden" name="postId" th:value="${post.id}">
                    <textarea name="comment" rows="2" placeholder="댓글을 적어 주세요" aria-label="댓글"></textarea>
                    <button class="btn btn-primary" type="submit">등록</button>
                </form>
                <p class="empty-note" th:if="${comments.isEmpty()}">등록된 댓글이 없습니다.</p>
                <ul class="comment-list" th:unless="${comments.isEmpty()}">
                    <li class="comment-item" th:each="c : ${comments}"
                        th:classappend="${c.depth > 0} ? 'is-reply'" th:data-id="${c.id}">
                        <div class="comment-head">
                            <span class="comment-name" th:text="${c.userName}">이름</span>
                            <span class="comment-id" th:text="${c.userId}">사번</span>
                            <span class="comment-time" th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd HH:mm')}">시각</span>
                            <span class="comment-actions">
                                <button type="button" class="link-btn" data-fold="reply" th:if="${c.replyable()}">답글</button>
                                <button type="button" class="link-btn" data-fold="edit" th:if="${c.userId == currentUserId}">수정</button>
                                <button type="button" class="link-btn" data-delete th:data-id="${c.id}"
                                        th:if="${admin or c.userId == currentUserId}">삭제</button>
                            </span>
                        </div>
                        <p class="comment-text" th:text="${c.comment}">내용</p>
                        <form class="comment-fold" data-fold-name="reply" th:if="${c.replyable()}"
                              th:action="@{/post/comment/reply}" method="post">
                            <input type="hidden" name="boardId" th:value="${boardId}">
                            <input type="hidden" name="postId" th:value="${post.id}">
                            <input type="hidden" name="refId" th:value="${c.refId}">
                            <textarea name="comment" rows="2" placeholder="답글" aria-label="답글"></textarea>
                            <button class="btn btn-primary" type="submit">등록</button>
                        </form>
                        <form class="comment-fold" data-fold-name="edit" th:if="${c.userId == currentUserId}"
                              th:action="@{/post/comment/update}" method="post">
                            <input type="hidden" name="boardId" th:value="${boardId}">
                            <input type="hidden" name="postId" th:value="${post.id}">
                            <input type="hidden" name="id" th:value="${c.id}">
                            <textarea name="comment" rows="2" aria-label="댓글 수정" th:text="${c.comment}"></textarea>
                            <button class="btn btn-primary" type="submit">수정</button>
                        </form>
                    </li>
                </ul>
            </th:block>
            <p class="empty-note" th:if="${post.removed()}">삭제된 게시물에는 댓글을 작성할 수 없습니다.</p>
        </div>
    </section>

    <form th:action="@{/post/comment/delete}" method="post" name="commentDeleteFrm">
        <input type="hidden" name="boardId" th:value="${boardId}">
        <input type="hidden" name="postId" th:value="${post.id}">
        <input type="hidden" name="id">
    </form>
</th:block>
</body>
</html>
