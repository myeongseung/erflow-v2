<!DOCTYPE html>
<!--/*
  글 수정 (D-159).
  출처: legacy/ERFlow/src/main/webapp/post/postUpdate.jsp

  글쓰기와 같은 폼 카드에 값이 채워져 있다. 이미 붙은 첨부는 이름을 보여 주고,
  새로 고른 파일은 js/post/write.js 가 그 아래에 적어 준다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: page('글 수정', ${ {'/js/vendor/jquery-3.7.1.min.js', '/js/vendor/jodit-4.13.23.min.js', '/js/common/editor.js', '/js/post/write.js'} })}">
</head>
<body th:insert="~{fragments/user-shell :: shell('사용자 &gt; 게시판 &gt; ' + ${board.subject} + ' &gt; 글 수정', null, ~{::content})}">
<th:block th:fragment="content">
    <form class="wide-form" method="post" th:action="@{/post/update}" enctype="multipart/form-data">
        <input type="hidden" name="boardId" th:value="${boardId}">
        <input type="hidden" name="id" th:value="${post.id}">
        <div class="form-group">
            <label for="subject">제목</label>
            <input type="text" id="subject" name="subject" placeholder="제목을 입력해주세요"
                   th:value="${post.subject}" required autofocus>
        </div>
        <div class="form-group">
            <label for="editor1">본문</label>
            <textarea name="content" id="editor1" rows="10" cols="80" th:text="${post.content}"></textarea>
        </div>
        <div class="form-group">
            <label for="filename">첨부 파일</label>
            <ul class="file-list" th:if="${!attachments.isEmpty()}">
                <li th:each="file : ${attachments}" th:text="${file.displayName()}">파일명</li>
            </ul>
            <input type="file" id="filename" name="filename" multiple>
            <ul class="file-list" id="fileList"></ul>
        </div>
        <div class="btn-group">
            <a class="btn" th:href="@{/post/view(boardId=${boardId}, id=${post.id})}">취소</a>
            <button class="btn btn-primary" type="submit">저장</button>
        </div>
    </form>
</th:block>
</body>
</html>
