<!DOCTYPE html>
<!--/*
  게시판 목록 (D-159).
  출처: legacy/ERFlow/src/main/webapp/post/boardList.jsp

  목록 틀(D-148)의 카드 하나. 게시판 이름을 누르면 그 게시판의 글 목록으로 간다.
  검색과 쪽 번호는 보통의 GET 폼·링크다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: page('게시판', ${ {'/js/common/table.js'} })}">
</head>
<body th:insert="~{fragments/user-shell :: shell('사용자 &gt; 게시판', |게시판 ${page.totalRecord}|, ~{::content})}">
<th:block th:fragment="content">
    <section class="list-card">
        <div class="toolbar">
            <div class="toolbar-actions">
                <h2 class="card-title">게시판</h2>
                <span class="count-badge" th:text="${page.totalRecord}">4</span>
            </div>
            <form class="toolbar-search" th:action="@{/post/board-list}" method="get">
                <div class="main-search-container">
                    <div class="main-search-border">
                        <input class="main-search-text" type="search" name="keyword"
                               placeholder="게시판 이름 검색" aria-label="게시판 이름 검색어" th:value="${keyword}">
                    </div>
                    <div class="main-search-icon">
                        <i class="fa-solid fa-magnifying-glass fa-lg" title="검색하기"></i>
                    </div>
                </div>
            </form>
        </div>
        <div class="table-scroll">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th scope="col">게시판</th>
                    <th scope="col">글 수</th>
                    <th scope="col">최신 글</th>
                    <th scope="col">최근 글 시각</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(boards)}">
                    <td colspan="4" class="empty-cell">검색 결과가 없습니다.</td>
                </tr>
                <tr th:each="board : ${boards}">
                    <td><a class="row-link" th:href="@{/post/list(boardId=${board.id})}" th:text="${board.subject}">게시판</a></td>
                    <td th:text="${board.postCount}">0</td>
                    <td class="ellipsis-cell">
                        <a th:if="${board.hasRecent()}"
                           th:href="@{/post/view(boardId=${board.id}, id=${board.recentPostId})}"
                           th:text="${board.recentSubject}" th:title="${board.recentSubject}">제목</a>
                        <span class="muted-text" th:unless="${board.hasRecent()}">글 없음</span>
                    </td>
                    <td th:text="${board.hasRecent()} ? ${#temporals.format(board.recentCreatedAt, 'yyyy-MM-dd HH:mm')} : '-'">-</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="page-controller" th:if="${page.totalPage > 1}">
            <a th:if="${page.hasPreviousBlock()}"
               th:href="@{/post/board-list(nowPage=${page.pagePerBlock * (page.nowBlock - 2) + 1},keyword=${keyword})}">이전</a>
            <ul class="page-numbers">
                <li th:each="n : ${page.pageNumbers}">
                    <a th:href="@{/post/board-list(nowPage=${n},keyword=${keyword})}"
                       th:classappend="${n == page.nowPage} ? 'disabled'" th:text="${n}">1</a>
                </li>
            </ul>
            <a th:if="${page.hasNextBlock()}"
               th:href="@{/post/board-list(nowPage=${page.pagePerBlock * page.nowBlock + 1},keyword=${keyword})}">다음</a>
        </div>
    </section>
</th:block>
</body>
</html>
