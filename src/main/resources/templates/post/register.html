<!DOCTYPE html>
<!--/*
  글쓰기 (D-159).
  출처: legacy/ERFlow/src/main/webapp/post/postRegister.jsp

  폼 카드 하나 — 제목 · 본문(편집기, D-120) · 첨부 · 취소/게시. 게시판 이름은 길
  표시에 있다(옛 화면은 «자유게시판» 으로 박혀 있었다, D-032). 첨부는 여러 개이고
  고른 파일 이름을 js/post/write.js 가 아래에 적어 준다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: page('글쓰기', ${ {'/js/vendor/jquery-3.7.1.min.js', '/js/vendor/jodit-4.13.23.min.js', '/js/common/editor.js', '/js/post/write.js'} })}">
</head>
<body th:insert="~{fragments/user-shell :: shell('사용자 &gt; 게시판 &gt; ' + ${board.subject} + ' &gt; 글쓰기', null, ~{::content})}">
<th:block th:fragment="content">
    <form class="wide-form" method="post" th:action="@{/post/register}" enctype="multipart/form-data">
        <input type="hidden" name="boardId" th:value="${boardId}">
        <div class="form-group">
            <label for="subject">제목</label>
            <input type="text" id="subject" name="subject" placeholder="제목을 입력해주세요" required autofocus>
        </div>
        <div class="form-group">
            <label for="editor1">본문</label>
            <textarea name="content" id="editor1" rows="10" cols="80"></textarea>
        </div>
        <div class="form-group">
            <label for="filename">첨부 파일</label>
            <input type="file" id="filename" name="filename" multiple>
            <ul class="file-list" id="fileList"></ul>
        </div>
        <div class="btn-group">
            <a class="btn" th:href="@{/post/list(boardId=${boardId})}">취소</a>
            <button class="btn btn-primary" type="submit">게시</button>
        </div>
    </form>
</th:block>
</body>
</html>
