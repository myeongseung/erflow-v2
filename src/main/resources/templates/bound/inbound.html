<!DOCTYPE html>
<!--/*
  입고 제품 관리 — 목록.
  출처: legacy/ERFlow/src/main/webapp/bound/inbound.jsp

  출고(outbound)와 거의 같지만 화면 글자(입고/입고자/입고 시간)와 권한·경로가 달라
  파일을 둘로 둔다. type=0(입고)로 조회한다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('입고 페이지', ${ {'/css/bootcss/bootstrap.css', 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css', '/css/bootcss/bootstrap.css', '/css/common/common.css', '/css/common/page.css', '/css/main/header.css', '/css/main/aside.css', '/css/main/bound.css'} }, ${ {'https://code.jquery.com/jquery-latest.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.9.2/umd/popper.min.js', '/js/main/index.js', '/js/main/bound.js', '/js/bootjs/bootstrap.js'} })}">
</head>
<body>
<div class="wrap">
    <th:block th:replace="~{fragments/header :: header(${headerMenu}, ${currentUser})}"></th:block>

    <div class="content-wrap">
        <th:block th:replace="~{fragments/side-menu :: side(${sideMenu})}"></th:block>

        <div class="table-wrap">
            <div class="right-align">
                <span class="menu-name">사용자 &gt; 구매 &gt; 입고 제품 관리 </span>
            </div>

            <form th:action="@{/bound/delete-proc}" method="post" name="boundFrm">
                <input type="hidden" name="flag" value="inbound">
                <div class="table-header-container">
                    <div class="button-group">
                        <button type="button" class="btn btn-danger" id="delete-button"
                                name="inbound" value="delete">삭제</button>
                        <button type="button" class="btn btn-primary" id="register-button"
                                data-value="inbound">추가</button>
                    </div>
                    <div class="search-option">
                        <select name="keyfield" id="">
                            <option value="" th:selected="${keyfield == ''}">전체조회</option>
                            <option value="id" th:selected="${keyfield == 'id'}">제품ID</option>
                            <option value="productName" th:selected="${keyfield == 'productName'}">제품명</option>
                            <option value="userName" th:selected="${keyfield == 'userName'}">입고자</option>
                            <option value="date" th:selected="${keyfield == 'date'}">날짜</option>
                        </select>
                        <div class="main-search-container">
                            <div class="main-search-border">
                                <input class="main-search-text" type="search" placeholder="검색"
                                       aria-label="Search" name="keyword" th:value="${keyword}">
                            </div>
                            <div class="main-search-icon">
                                <i class="fa-solid fa-magnifying-glass fa-lg" title="검색하기"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th scope="col"><input type="checkbox" id="chkAll"></th>
                        <th scope="col">번호</th>
                        <th scope="col">제품명</th>
                        <th scope="col">입고자</th>
                        <th scope="col">주소</th>
                        <th scope="col">입고 시간</th>
                        <th scope="col">수량</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="bound : ${bounds}">
                        <th scope="col"><input type="checkbox" name="boundId" th:value="${bound.id}"></th>
                        <td>
                            <a th:href="@{/bound/update(flag='inbound',id=${bound.id})}"
                               th:text="${bound.id}">1</a>
                        </td>
                        <td th:text="${bound.productName}">제품명</td>
                        <td th:text="${bound.userName}">입고자</td>
                        <td th:text="${bound.fullAddress()}">주소</td>
                        <td th:text="${bound.boundedAt}">입고 시간</td>
                        <td th:text="${bound.count}">수량</td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <td colspan="6"></td>
                    <td></td>
                    </tfoot>
                </table>
            </form>
            <form name="readFrm" method="get" th:action="@{/bound/inbound}">
                <input type="hidden" name="nowPage" th:value="${page.nowPage}">
                <input type="hidden" name="keyfield" th:value="${keyfield}">
                <input type="hidden" name="keyword" th:value="${keyword}">
            </form>

            <!--/* 페이징 (bound.js 의 block/paging 이 readFrm 을 제출한다) */-->
            <div class="page-controller">
                <a th:if="${page.hasPreviousBlock()}" class="disabled"
                   th:href="|javascript:block(5, ${page.nowBlock - 1})|">이전</a>
                <ul class="page-numbers">
                    <a th:each="number : ${page.pageNumbers}"
                       th:href="|javascript:paging(${number})|"
                       th:classappend="${number == page.nowPage} ? 'disabled'">
                        <li th:text="${number}">1</li>
                    </a>
                </ul>
                <a th:if="${page.hasNextBlock()}"
                   th:href="|javascript:block(5, ${page.nowBlock + 1})|">다음</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
