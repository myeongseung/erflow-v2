<!DOCTYPE html>
<!--/*
  입·출고 수정.
  출처: legacy/ERFlow/src/main/webapp/bound/boundUpdate.jsp

  기존 값을 채우되 날짜는 비운 채 다시 받는다(레거시 그대로 — 날짜는 수정 대상이 아니다).
  숨은 userId 에 제품 코드가 들어간다(D-048) — 직원을 다시 고르지 않고 제출하면
  user_tbl_id 가 제품 코드로 덮인다. 레거시 결함을 그대로 옮겼다.

  등록과 달리 우편번호·주소 입력이 readonly 가 아니고, 버튼이 «우편 찾기», 참고항목
  칸이 «참고항목» 이며 직원 찾기가 find-user 다. 라벨 for 값도 레거시 그대로다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:with="isInbound=${flag == 'inbound'}">
<head th:replace="~{fragments/head :: head(${isInbound ? '입고수정 페이지' : '출고수정 페이지'}, ${ {'http://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css', 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css', '/css/bootcss/bootstrap.css', '/css/common/common.css', '/css/main/aside.css', '/css/main/header.css', '/css/main/boundRegister.css'} }, ${ {'https://code.jquery.com/jquery-latest.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.9.2/umd/popper.min.js', 'https://code.jquery.com/jquery-1.12.4.js', 'https://code.jquery.com/ui/1.12.1/jquery-ui.js', '//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js', '/js/bootjs/bootstrap.js', '/js/admin/location.js', '/js/main/index.js', '/js/main/bound.js', '/js/datepicker.js'} })}">
</head>
<body>
<th:block th:replace="~{fragments/header :: header(${headerMenu}, ${currentUser})}"></th:block>

<div class="content-wrap">
    <th:block th:replace="~{fragments/side-menu :: side(${sideMenu})}"></th:block>

    <div class="bound-insert-wrap">
        <div class="right-align">
            <span class="menu-name"
                  th:text="|사용자 &gt; ${isInbound ? '구매' : '영업'} &gt; ${isInbound ? '입고' : '출고'} 수정|">사용자 &gt; 구매 &gt; 입고 수정</span>
        </div>
        <div class="bound-insert">
            <div class="bound-form">
                <form th:action="@{/bound/update-proc}" method="post" name="boundFrm">
                    <input type="hidden" name="boundId" th:value="${boundId}">
                    <input type="hidden" name="flag" th:value="${flag}">

                    <div class="form-group d-grid gap-2">
                        <label for="input1">제품명:</label>
                        <input type="text" id="productName" name="productName"
                               th:value="${bound.productName}" placeholder="제품명" readonly>
                        <input type="hidden" id="productId" name="productId" th:value="${bound.productId}"><br>
                        <input type="button" class="btn btn-secondary btn-lg" id="find-product" value="제품 찾기">
                    </div>

                    <div class="form-group d-grid gap-2">
                        <label for="input1" th:text="|${isInbound ? '입고' : '출고'}자:|">입고자:</label>
                        <input type="text" id="userName" name="userName" th:value="${bound.userName}"
                               th:placeholder="|${isInbound ? '입고' : '출고'}자|" readonly>
                        <input type="hidden" id="userId" name="userId" th:value="${bound.userId}"><br>
                        <input type="button" class="btn btn-secondary btn-lg" id="find-user" value="직원 찾기">
                    </div>

                    <div class="form-group">
                        <label for="input4">창고 주소:</label>
                        <input type="text" id="sample6_postcode" placeholder="우편번호" name="postalCode"
                               th:value="${bound.postalCode}">
                        <input type="text" id="sample6_extraAddress" placeholder="참고항목">
                        <input type="button" class="btn btn-secondary btn-lg w-100 btn_execDaumPostcode" value="우편 찾기">
                        <input type="text" id="sample6_address" placeholder="도로명 주소" name="address1"
                               th:value="${bound.address1}"><br>
                        <input type="text" id="sample6_detailAddress" placeholder="상세주소" name="address2"
                               th:value="${bound.address2}">
                    </div>

                    <div class="form-group">
                        <label for="input7">수량</label>
                        <input type="text" id="input7" name="count" placeholder="수량" th:value="${bound.count}">
                    </div>
                    <div class="form-group">
                        <label for="input8" th:text="|${isInbound ? '입고' : '출고'} 날짜|">입고 날짜</label>
                        <input type="text" id="datepicker" name="boundedAt"
                               th:placeholder="|${isInbound ? '입고' : '출고'}날짜|">
                    </div>
                    <div class="form-group text-center">
                        <button type="submit" class="form-Register-btn">제출</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
