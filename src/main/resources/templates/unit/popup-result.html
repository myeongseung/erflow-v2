<!DOCTYPE html>
<!--/*
  처리 결과.
  출처: unitRegisterProc.jsp / unitUpdateProc.jsp / unitDeleteProc.jsp

  레거시 *Proc.jsp 는 화면이 아니라 처리 전용이었다. 결과를 alert 로 알리고,
  팝업이면 부모를 새로 고친 뒤 자신을 닫았다. 목록에서 온 삭제는 목록으로 돌아갔다.

  redirect 로 바꾸는 편이 요즘 방식이지만 화면 흐름이 달라진다. 이관에서는 동작을
  유지하고, 개선은 별도 안건으로 둔다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>처리 결과</title>
</head>
<body>
<script th:inline="javascript">
    /*<![CDATA[*/
    alert(/*[[${message}]]*/ '');

    if (/*[[${closePopup}]]*/ false) {
        window.opener.document.location.href = window.opener.document.location.href;
        window.close();
    } else {
        location.href = /*[[${nextPage}]]*/ '/';
    }
    /*]]>*/
</script>
</body>
</html>
