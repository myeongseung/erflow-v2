spring:
  application:
    name: erflow

  datasource:
    # 기본값이 `erflow` 를 가리키면 안 된다 — 그쪽은 레거시 정답이고 읽기
    # 전용이다(D-116). 프로파일 없이 뜨더라도 앱 스키마를 향하게 둔다.
    url: ${ERFLOW_DB_URL:jdbc:mariadb://localhost:3306/erflow_v2}
    username: ${ERFLOW_DB_USER:erflow}
    password: ${ERFLOW_DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver

  thymeleaf:
    # 레거시 화면을 1:1 로 옮기는 중에는 캐시가 켜져 있으면 확인이 느려진다.
    cache: false

  servlet:
    multipart:
      # 레거시 DiskFileItemFactory 의 임계값이 20MB 였다. 같은 크기로 둔다.
      max-file-size: 20MB
      max-request-size: 100MB

mybatis:
  # 애너테이션 SQL 을 쓰지 않고 XML 매퍼로 모은다.
  # 이관한 SQL 이 레거시의 어느 쿼리에서 왔는지 한곳에서 대조할 수 있어야 한다.
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.erflow
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30

server:
  port: ${ERFLOW_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  level:
    com.erflow: DEBUG

erflow:
  upload:
    # 첨부 저장 폴더. 레거시는 WAR 안의 /upload 였다 — 실행 가능한 jar 에는
    # 그런 경로가 없고, 있다 해도 재배포하면 첨부가 사라진다(D-027).
    dir: ${ERFLOW_UPLOAD_DIR:./data/upload}
